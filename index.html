<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مُعِين — رفيقك اليومي</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مُعِين">
<meta name="theme-color" content="#0f5132">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Aref+Ruqaa:wght@400;700&display=swap');

  :root{
    --ink:#1c2620;
    --paper:#f7f3e8;
    --paper-2:#eee7d4;
    --card:#fffdf8;
    --green-deep:#0b3d2c;
    --green:#146b46;
    --green-soft:#dfeee3;
    --green-softer:#eff6f0;
    --gold:#bc9a4f;
    --gold-soft:#f8ecd2;
    --gold-deep:#8a6a24;
    --line:#e2d9bf;
    --line-2:#d5c9a6;
    --danger:#8f3a3a;
    --danger-soft:#f2e0dd;
    --muted:#7c8177;
    --shadow: 0 12px 32px rgba(11,61,44,0.10);
    --shadow-sm: 0 4px 16px rgba(11,61,44,0.08);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Cairo', system-ui, sans-serif;
    background:
      radial-gradient(circle at 10% -10%, #eef4ec 0%, transparent 40%),
      radial-gradient(circle at 100% 0%, #fbf3df 0%, transparent 35%),
      var(--paper);
    color:var(--ink);
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ===== Header ===== */
  .app-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 8px; max-width:720px; margin:0 auto; width:100%;
    flex-shrink:0;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .logo{
    width:42px; height:42px; border-radius:13px;
    background:linear-gradient(145deg, var(--green-deep), var(--green));
    display:flex; align-items:center; justify-content:center;
    font-size:21px; color:#fff; box-shadow:var(--shadow-sm);
    overflow:hidden; flex-shrink:0;
  }
  .brand .logo img{ width:100%; height:100%; object-fit:cover; }
  .brand .name{ font-weight:800; font-size:19px; color:var(--green-deep); font-family:'Aref Ruqaa',serif; line-height:2; padding-top:2px; }
  .brand .tagline{ font-size:11px; color:var(--muted); margin-top:-2px; }

  .sig-mark{
    position:absolute; bottom:-4px; left:-4px; width:19px; height:19px; border-radius:50%;
    background:var(--gold); color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Aref Ruqaa', serif; font-size:13px; font-weight:700; border:2px solid var(--paper);
    box-shadow:0 1px 4px rgba(0,0,0,.2);
  }
  .sig-name{ font-family:'Aref Ruqaa', serif; font-weight:700; }
  .sig-motto{ font-style:italic; }
  .sig-block{ text-align:center; }
  .sig-block .sig-name-line{ font-family:'Aref Ruqaa', serif; font-size:19px; color:var(--gold-deep); margin-bottom:4px; }
  .sig-block .sig-motto-line{ font-size:12.5px; color:var(--muted); font-style:italic; line-height:1.6; }
  .streak-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--gold-soft); border:1px solid #f0dfb0; color:var(--gold-deep);
    padding:7px 12px; border-radius:999px; font-weight:700; font-size:13px;
  }

  /* ===== Scrollable content area (only this part scrolls) ===== */
  .content{
    max-width:720px; margin:0 auto; width:100%; padding:6px 16px 28px;
    flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
  }

  /* ===== Bottom Nav & Action Bar — normal flex children, never overlapped ===== */
  .bottom-nav{
    flex-shrink:0;
    background:rgba(255,255,255,0.94); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex; justify-content:space-around; padding:7px 2px calc(7px + env(safe-area-inset-bottom));
    z-index:40;
  }
  .action-bar{
    flex-shrink:0;
    background:var(--paper); border-top:1px solid var(--line);
    padding:10px 16px; z-index:41; max-width:720px; margin:0 auto; width:100%;
    box-shadow:0 -4px 16px rgba(15,81,50,0.06);
  }
  .nav-btn{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; cursor:pointer; padding:6px 2px; border-radius:11px;
    color:var(--muted); font-family:'Cairo'; font-size:9.5px; font-weight:700; flex:1; max-width:76px;
    transition:.15s;
  }
  .nav-btn .ic{ font-size:18px; line-height:1; }
  .nav-btn.active{ color:var(--green-deep); background:var(--green-soft); }

  /* ===== Generic Card ===== */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow-sm); padding:20px; margin-bottom:16px;
  }
  .card h2{ margin:0 0 14px; font-size:17px; color:var(--green-deep); display:flex; align-items:center; gap:8px; }
  .section-title{ font-size:13px; font-weight:800; color:var(--gold-deep); text-transform:uppercase; letter-spacing:.04em; margin:22px 0 10px; }
  .section-title:first-child{ margin-top:4px; }

  /* ===== Buttons ===== */
  .btn{
    padding:11px 20px; border-radius:12px; border:none; cursor:pointer;
    font-weight:700; font-size:14px; font-family:'Cairo'; transition:.15s;
  }
  .btn-primary{ background:var(--green-deep); color:#fff; }
  .btn-primary:hover{ background:#0c3d27; }
  .btn-primary:disabled{ background:#c8d3cb; cursor:not-allowed; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-ghost{ background:var(--paper-2); color:var(--ink); }
  .btn-ghost:hover{ background:#e9e3d3; }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:7px 13px; font-size:12.5px; border-radius:9px; }

  /* ===== Progress ===== */
  .bar-track{ background:var(--paper-2); border-radius:999px; height:10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, var(--green), var(--green-deep)); transition:width .5s ease; }
  .bar-fill.gold{ background:linear-gradient(90deg, var(--gold), var(--gold-deep)); }

  .ring-wrap{ position:relative; display:inline-flex; }
  .ring-wrap svg{ transform:rotate(-90deg); }
  .ring-wrap .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-weight:600;
  }

  /* ===== Task rows (shared: memorization + habits) ===== */
  .task-row{
    display:flex; align-items:flex-start; gap:12px;
    padding:13px 14px; border-radius:13px; border:1px solid var(--line);
    background:var(--paper); margin-bottom:9px; transition:.15s;
  }
  .task-row.done{ background:var(--green-soft); border-color:#bfe0cc; }
  .task-row.dragging{ opacity:.55; box-shadow:var(--shadow); background:var(--card); }
  .habit-drag-handle{ color:var(--line-2); font-size:16px; cursor:grab; padding:4px 2px; touch-action:none; user-select:none; flex-shrink:0; }
  .habit-drop-placeholder{ border:2px dashed var(--line-2); border-radius:13px; margin-bottom:9px; background:var(--paper-2); }
  .task-row .check{
    width:25px; height:25px; border-radius:50%; border:2px solid var(--green);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    flex-shrink:0; background:#fff; color:transparent; font-size:13px; transition:.15s; margin-top:1px;
  }
  .task-row.done .check{ background:var(--green); color:#fff; }
  .task-row .body{ flex:1; min-width:0; }
  .task-row .label{ font-weight:700; font-size:13.5px; color:var(--gold-deep); margin-bottom:2px; }
  .task-row .detail{ font-size:14.5px; color:var(--ink); line-height:1.5; }
  .task-row.done .detail{ color:#7c8a7f; }
  .task-row .sub{ font-size:12px; color:var(--muted); margin-top:3px; }

  /* ===== Empty state ===== */
  .empty{ text-align:center; padding:44px 16px; color:var(--muted); }
  .empty .big{ font-size:38px; margin-bottom:10px; }

  /* ===== Chips row (courses/tabs within tabs) ===== */
  .chips-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .chip{
    padding:8px 15px; border-radius:999px; background:#fff; border:1.5px solid var(--line);
    cursor:pointer; font-weight:700; font-size:13px; display:flex; align-items:center; gap:6px;
  }
  .chip.active{ background:var(--green-deep); color:#fff; border-color:var(--green-deep); }
  .btn-ghost.active{ background:var(--green-deep); color:#fff; border-color:var(--green-deep); }
  .chip-add{ background:var(--gold-soft); border:1.5px dashed var(--gold); color:var(--green-deep); }

  /* ===== Modal ===== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,36,29,.45); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .modal{ background:#fff; border-radius:18px; padding:24px; width:100%; max-width:380px; box-shadow:0 20px 50px rgba(0,0,0,.2); max-height:85vh; overflow-y:auto; }
  .modal h3{ margin:0 0 16px; font-size:18px; color:var(--green-deep); }
  .modal input[type=text], .modal input[type=number]{
    width:100%; padding:11px 14px; border-radius:11px; border:1.5px solid var(--line);
    font-family:'Cairo'; font-size:14px; margin-bottom:14px; background:var(--paper);
  }
  .modal input:focus{ outline:none; border-color:var(--green); }
  .modal-btns{ display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  .emoji-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .emoji-opt{
    width:42px; height:42px; border-radius:12px; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; background:#fff;
  }
  .emoji-opt.sel{ border-color:var(--green); background:var(--green-soft); }

  /* ===== Stats grid ===== */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat-box{
    background:var(--card); border:1px solid var(--line); border-radius:15px; padding:16px;
    text-align:center;
  }
  .stat-box .num{ font-family:'IBM Plex Mono'; font-weight:600; font-size:26px; color:var(--green-deep); }
  .stat-box .lbl{ font-size:12px; color:var(--muted); margin-top:3px; }

  .badge-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .badge{
    display:flex; align-items:center; gap:6px; padding:8px 13px; border-radius:12px;
    background:var(--gold-soft); border:1px solid #f0dfb0; font-size:12.5px; font-weight:700; color:var(--gold-deep);
  }
  .badge.locked{ background:var(--paper-2); border-color:var(--line); color:#b3ac9a; }

  .week-bars{ display:flex; align-items:flex-end; gap:6px; height:70px; }
  .week-bars .col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; height:100%; }
  .week-bars .fill{ width:100%; border-radius:6px 6px 3px 3px; background:linear-gradient(180deg, var(--green), var(--green-deep)); min-height:4px; }
  .week-bars .day-lbl{ font-size:10px; color:var(--muted); }

  .banner{
    display:flex; align-items:center; gap:10px; justify-content:center;
    background:var(--gold-soft); border:1px solid var(--gold); border-radius:13px;
    padding:12px; margin-bottom:14px; font-weight:700; color:var(--gold-deep); font-size:13.5px; text-align:center;
  }  .quote-card{
    background:linear-gradient(135deg, var(--green-deep), #072920); color:#fdfbf3;
    border-radius:var(--radius); padding:22px; margin-bottom:16px; text-align:center;
    box-shadow:var(--shadow);
  }
  .quote-card .q{ font-size:15px; line-height:1.7; font-weight:600; }
  .quote-card .a{ font-size:11.5px; opacity:.75; margin-top:8px; }

  .knowledge-card{ border-color:#e8ddc3; background:linear-gradient(180deg, #fffdf7, #fff); transition:.15s; }
  .knowledge-card:active{ transform:scale(0.98); }
  .knowledge-teaser{ font-size:13px; line-height:1.7; color:var(--muted); }
  .knowledge-cta{ font-size:12px; font-weight:800; color:var(--green); margin-top:10px; }
  .knowledge-modal-body{ font-size:14px; line-height:1.9; color:var(--ink); white-space:pre-line; }
  .knowledge-lessons{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .knowledge-lessons .lbl{ font-weight:800; font-size:13px; color:var(--gold-deep); margin-bottom:8px; }
  .knowledge-lessons ul{ margin:0; padding-right:20px; }
  .knowledge-lessons li{ font-size:13px; line-height:1.8; margin-bottom:6px; color:var(--ink); }

  .schedule-card{
    background:var(--green-softer); border:1px solid #cfe3d6; border-radius:14px;
    padding:16px; margin-bottom:16px;
  }
  .knowledge-type{
    display:inline-block; font-size:11px; font-weight:800; color:var(--gold-deep);
    background:var(--gold-soft); border:1px solid #f0dfb0; padding:3px 11px; border-radius:999px; margin-bottom:9px;
  }
  .knowledge-title{ font-weight:800; font-size:15px; color:var(--green-deep); margin-bottom:6px; }
  .knowledge-body{ font-size:13.5px; line-height:1.8; color:var(--ink); }

  .home-course-row{
    display:flex; align-items:center; gap:10px; padding:12px 10px; border-radius:12px;
    cursor:pointer; transition:.15s; margin-bottom:4px;
  }
  .home-course-row:hover{ background:var(--paper-2); }
  .home-course-row:active{ background:var(--green-soft); }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; width:100%; }
  .cal-dow{ text-align:center; font-size:10.5px; font-weight:800; color:var(--muted); padding-bottom:4px; overflow:hidden; }
  .cal-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; min-width:0;
    border-radius:8px; font-size:11.5px; font-weight:700; font-family:'IBM Plex Mono';
    background:var(--paper-2); color:#b3ac9a;
  }
  .cal-cell.empty{ background:transparent; }
  .cal-cell.done{ background:var(--green); color:#fff; }
  .cal-cell.partial{ background:var(--gold-soft); color:var(--gold-deep); border:1px solid var(--gold); }
  .cal-cell.missed{ background:var(--danger-soft); color:var(--danger); opacity:.7; }
  .cal-cell.today{ outline:2.5px solid var(--gold); outline-offset:1px; }
  .legend-dot{ display:inline-block; width:9px; height:9px; border-radius:3px; margin-left:4px; vertical-align:middle; }
  .legend-dot.done{ background:var(--green); }
  .legend-dot.partial{ background:var(--gold-soft); border:1px solid var(--gold); }
  .legend-dot.missed{ background:var(--danger-soft); border:1px solid var(--danger); }
  .legend-dot.today{ background:#fff; border:2px solid var(--gold); }
  .stats-note{ font-size:12px; color:var(--muted); line-height:1.7; margin:2px 4px 18px; text-align:center; }

  .plan-juz-banner{
    background:var(--green-deep); color:#fff; font-weight:800; font-size:12.5px;
    text-align:center; padding:8px; border-radius:9px; margin:10px 0 6px;
  }
  .plan-juz-banner:first-child{ margin-top:0; }
  .plan-row{
    display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:9px; font-size:12.5px;
  }
  .plan-row.plan-done{ color:#8a9186; }
  .plan-row.plan-next{ background:var(--gold-soft); border:1px solid var(--gold); font-weight:700; }
  .plan-badge{
    width:20px; height:20px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; background:var(--paper-2); color:var(--green);
  }
  .plan-row.plan-done .plan-badge{ background:var(--green-soft); color:var(--green-deep); }
  .plan-row.plan-next .plan-badge{ background:var(--gold); color:#fff; }
  .plan-label{ flex:1; }
  .plan-tag{ font-size:10.5px; color:var(--muted); flex-shrink:0; }

  a{ color:inherit; }
  ::selection{ background:var(--green-soft); }

  input[type=range]{ width:100%; accent-color:var(--green); }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line); }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row .t{ font-weight:700; font-size:14px; }
  .settings-row .d{ font-size:12px; color:var(--muted); margin-top:2px; }
  .switch{
    width:44px; height:26px; border-radius:999px; background:var(--line-2); position:relative; cursor:pointer; flex-shrink:0;
  }
  .switch.on{ background:var(--green); }
  .switch .knob{ position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s; }
  .switch.on .knob{ right:21px; }


  .more-menu{ position:fixed; right:12px; bottom:76px; width:min(360px,calc(100vw - 24px)); background:rgba(255,253,248,.98); border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.18); padding:10px; z-index:90; }
  .more-item{ display:flex; align-items:center; gap:12px; width:100%; padding:12px; border:0; background:none; border-radius:13px; text-align:right; font-family:Cairo; cursor:pointer; }
  .more-item:hover{ background:var(--paper-2); }
  .more-item .mi{ width:38px;height:38px;border-radius:11px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0; }
  .swipe-wrap{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:12px; scrollbar-width:none; direction:ltr; }
  .swipe-wrap::-webkit-scrollbar{display:none;}
  .swipe-card{ min-width:100%; scroll-snap-align:start; direction:rtl; }
  .swipe-dots{display:flex;justify-content:center;gap:5px;margin-top:8px;}
  .swipe-dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);}
  .swipe-dot.active{background:var(--green);width:18px;border-radius:99px;}
  .feature-input{ width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper);font-family:Cairo;font-size:13px;margin-bottom:9px; }
  textarea.feature-input{ min-height:110px;resize:vertical; }
  .mini-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .mini-stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;}
  .mini-stat b{display:block;font-size:17px;color:var(--green-deep);}
  .mini-stat span{font-size:10px;color:var(--muted);}
  .feeling-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .feeling-btn{padding:11px 6px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-family:Cairo;font-weight:700;cursor:pointer;font-size:12px;}
  .feeling-btn.sel{border-color:var(--green);background:var(--green-soft);color:var(--green-deep);}
  .tomorrow-banner{background:var(--green-softer);border:1px solid #cfe3d6;border-radius:14px;padding:13px;text-align:center;font-size:13px;font-weight:700;color:var(--green-deep);margin-bottom:14px;}

  .done-spirit{background:linear-gradient(135deg,#f8ecd2,#fffdf8);border:1px solid var(--gold);border-radius:16px;padding:18px;text-align:center;color:var(--gold-deep);line-height:1.8;margin-bottom:14px;}
  .wizard-steps{display:flex;align-items:center;gap:7px;margin-bottom:16px;}
  .wizard-step{flex:1;height:5px;border-radius:99px;background:var(--line);}
  .wizard-step.on{background:var(--green);}
  .wizard-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:-9px;margin-bottom:14px;}
  .note-new-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:0;border-radius:13px;background:var(--green);color:#fff;font-family:Cairo;font-weight:800;font-size:13px;cursor:pointer;}
  .note-card{position:relative;padding:15px;border-radius:16px;background:linear-gradient(180deg,#fffdf8,#f6f1e5);border:1px solid var(--line);margin-bottom:9px;}
  .note-card .note-actions{display:flex;gap:6px;margin-top:11px;}
  .feeling-grid.pro{grid-template-columns:repeat(3,1fr);gap:9px;}
  .feeling-btn.pro{min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;border-radius:16px;background:linear-gradient(180deg,#fff,#f7f4eb);}
  .feeling-btn.pro .emo{font-size:25px;line-height:1;}
  .feeling-btn.pro .label{font-weight:800;}
  .feeling-custom{grid-column:span 3;border-style:dashed;background:var(--paper-2);}
  .feeling-result{background:linear-gradient(145deg,#fffdf8,#eef6ef);border:1px solid #d6e5d9;border-radius:20px;overflow:hidden;}

function esc(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function ring(pct, size=64, stroke=8, color){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c-(Math.min(pct,100)/100)*c;
  color = color || (pct>=100 ? 'var(--gold)' : 'var(--green)');
  return `<span class="ring-wrap"><svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--paper-2)" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .5s"/>
  </svg><span class="pct" style="font-size:${size*0.22}px">${Math.round(pct)}%</span></span>`;
}
function rubLabel(r, withWords){
  if(!r) return '';
  const words = withWords ? ` «${r.w}»` : '';
  if (r.sId === r.eId) return `${r.s} ${r.a1}-${r.a2}${words}`;
  return `${r.s}${r.a1}\u2192نهاية، ${r.e}1-${r.a2}${words}`;
}
function rangeLabelMulti(rubIdxs, withWords){
  if(!rubIdxs || !rubIdxs.length) return '—';
  const first = QBY[rubIdxs[0]], last = QBY[rubIdxs[rubIdxs.length-1]];
  const words = withWords ? ` «${first.w}»` : '';
  if(first.sId===last.eId) return `${first.s} ${first.a1}-${last.a2}${words}`;
  return `${first.s}${first.a1}\u2192نهاية، ${last.e}1-${last.a2}${words}`;
}
function appConfirm(message){
  return new Promise(resolve=>{
    const o=document.createElement('div');o.className='modal-overlay';
    o.innerHTML=`<div class="modal" style="text-align:center;max-width:340px">
      <div style="font-size:14px;line-height:1.9;margin-bottom:18px;font-weight:700">${esc(message)}</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-block" id="acCancel">إلغاء</button>
        <button class="btn btn-block" id="acOk" style="background:var(--danger);color:#fff">تأكيد الحذف</button>
      </div>
    </div>`;
    document.body.appendChild(o);
    const finish=(val)=>{o.remove();resolve(val);};
    o.querySelector('#acCancel').onclick=()=>finish(false);
    o.querySelector('#acOk').onclick=()=>finish(true);
    o.addEventListener('click',e=>{if(e.target===o)finish(false)});
  });
}
function toast(msg){
  let t = document.getElementById('toastEl');
  if(!t){ t=document.createElement('div'); t.id='toastEl';
    t.style.cssText='position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#17241d;color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;font-size:13.5px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(()=>{ t.style.opacity='1'; t.style.bottom='96px'; });
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.style.opacity='0'; }, 2200);
}

async function storageGet(key){
  try{ if(window.storage && typeof window.storage.get==='function'){ const res=await window.storage.get(key,false); if(res && res.value!=null) return JSON.parse(res.value); } }catch(e){}
  try{ const raw=localStorage.getItem('zad_'+key); return raw==null?null:JSON.parse(raw); }catch(e){ return null; }
}
async function storageSet(key,value){
  let ok=false;
  try{ if(window.storage && typeof window.storage.set==='function'){ await window.storage.set(key,JSON.stringify(value),false); ok=true; } }catch(e){}
  try{ localStorage.setItem('zad_'+key,JSON.stringify(value)); ok=true; }catch(e){}
  return ok;
}
async function loadAll(){
  const keys = ['branding','signature','quran','quranSettings','habits','habitChecks','courses','activeCourseId','activityLog','goals','notes','money','reminders','feelings','feelingHistory','dailyKnowledge'];
  for(const k of keys){
    try{ const val=await storageGet(k); if(val!=null) DB[k]=val; }catch(e){ /* keep defaults */ }

async function save(key){ try{ await storageSet(key,DB[key]); }catch(e){ console.error('save fail',key,e); } }
function markActivity(){
  DB.activityLog[todayStr()] = true;
  save('activityLog');
  updateStreakPill();
}

/* ============================================================
   STREAK — based on fully completing your habits for the day
   (a much clearer, more honest signal than "any single click")
   ============================================================ */
function isDayFullyDone(dateStr){
  if(!DB.habits.length) return false;
  const checks = DB.habitChecks[dateStr]||{};
  return DB.habits.every(h => checks[h.id]);
}
function dayCompletionPct(dateStr){
  if(!DB.habits.length) return 0;
  const checks = DB.habitChecks[dateStr]||{};
  const done = DB.habits.filter(h=>checks[h.id]).length;
  return Math.round(done/DB.habits.length*100);
}
function computeStreak(){
  if(!DB.habits.length) return 0;
  let streak = 0;
  let cursor = todayStr();
  if(!isDayFullyDone(cursor)){
    cursor = addDays(cursor, -1);
    if(!isDayFullyDone(cursor)) return 0;
  }
  while(isDayFullyDone(cursor)){
    streak++;
    cursor = addDays(cursor, -1);
  }
  return streak;
}
function computeBestStreak(){
  if(!DB.habits.length) return 0;
  const allDates = Object.keys(DB.habitChecks).sort();
  if(!allDates.length) return 0;
  let best=0, cur=0, prevDate=null;
  allDates.forEach(d=>{
    if(!isDayFullyDone(d)){ cur=0; prevDate=d; return; }
    if(prevDate && addDays(prevDate,1)===d) cur++;
    else cur=1;
    best=Math.max(best,cur);
    prevDate=d;
  });
  return best;
}
function updateStreakPill(){
  document.getElementById('streakPill').innerHTML = `🔥 ${computeStreak()}`;
}

   BRANDING
   ============================================================ */
function applyBranding(){
  const splashLogo=document.getElementById('splashLogo');
  if(splashLogo && DB.branding.logoType==='image' && DB.branding.logoValue) splashLogo.src=DB.branding.logoValue;
  // اسم التطبيق ثابت دائمًا: معين. الاسم القابل للتغيير هو اسم المستخدم في الإعدادات.
  document.getElementById('brandName').textContent = 'مُعِين';
  document.title = 'مُعِين';
  const firstLetter=(DB.branding.name||'عبدالله').trim().charAt(0)||'ع';
  const mark=document.querySelector('.sig-mark'); if(mark) mark.textContent=firstLetter;
  const logoEl = document.getElementById('brandLogo');
  if(DB.branding.logoType==='image' && DB.branding.logoValue){
    logoEl.innerHTML = `<img src="${DB.branding.logoValue}">`;
  } else {
    logoEl.textContent = DB.branding.logoValue || '🌱';
  }
  updateAppIcons();
}

/* Draws the current logo onto a canvas and sets it as the home-screen icon
   (apple-touch-icon / favicon). Browsers capture whatever this points to
   at the moment "Add to Home Screen" is tapped, so it stays in sync with
   whatever logo the person picks in Settings. */
function updateAppIcons(){
  try{
    const canvas = document.createElement('canvas');
    canvas.width = 180; canvas.height = 180;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0,0,180,180);
    grad.addColorStop(0,'#0f5132'); grad.addColorStop(1,'#1e7a4c');
    ctx.fillStyle = grad;
    ctx.beginPath();
    const r=36;
    ctx.moveTo(r,0); ctx.arcTo(180,0,180,180,r); ctx.arcTo(180,180,0,180,r); ctx.arcTo(0,180,0,0,r); ctx.arcTo(0,0,180,0,r);
    ctx.closePath(); ctx.fill();
    const finish = ()=> setIconLinks(canvas.toDataURL('image/png'));
    if(DB.branding.logoType==='image' && DB.branding.logoValue){
      const img = new Image();
      img.onload = ()=>{ ctx.save(); ctx.beginPath(); ctx.moveTo(r,0); ctx.arcTo(180,0,180,180,r); ctx.arcTo(180,180,0,180,r); ctx.arcTo(0,180,0,0,r); ctx.arcTo(0,0,180,0,r); ctx.closePath(); ctx.clip(); ctx.drawImage(img,0,0,180,180); ctx.restore(); finish(); };
      img.onerror = finish;
      img.src = DB.branding.logoValue;
    } else {
      // لو مفيش صورة لوجو: اعرض أول حرف من الاسم داخل الأيقونة، عشان يفضل متزامن مع الاسم.
      ctx.font = '700 92px Cairo, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle = '#f7f1df';
      ctx.fillText((DB.branding.name||'مُعِين').trim().charAt(0)||'م', 90, 98);
      finish();
    }
  }catch(e){ /* canvas not available, skip silently */ }
}
function setIconLinks(dataUrl){
  ['apple-touch-icon','icon'].forEach(rel=>{
    let link = document.querySelector(`link[rel="${rel}"]`);
    if(!link){ link=document.createElement('link'); link.rel=rel; document.head.appendChild(link); }
    link.href = dataUrl;
  });
}

/* ============================================================
   QURAN ENGINE
   ============================================================ */
function phaseOf(idx){ return idx<=16 ? 1 : 2; }
function quotaOf(idx){ return phaseOf(idx)===1 ? 2 : 1; }
function juzOfRub(rIdx){ return QBY[rIdx] ? QBY[rIdx].j : null; }

function computeQuranToday(){
  const st = DB.quran;
  if(st.nextMemoRubIndex > 240) return null;
  const quota = quotaOf(st.nextMemoRubIndex);
  const memoRubs = [];
  for(let i=0;i<quota && st.nextMemoRubIndex+i<=240;i++) memoRubs.push(st.nextMemoRubIndex+i);

  const nearRubs = st.lastSessionRubs;
  const lastSet = new Set(st.lastSessionRubs);
  const pool = st.completedRubs.filter(r=>!lastSet.has(r));

  let farRubs=[], farQuota=0, farCyclesApprox=0;
  if(pool.length>0){
    const cyc = Math.max(1, DB.quranSettings.targetCycleDays||21);
    farQuota = Math.min(Math.max(1, Math.ceil(pool.length/cyc)), pool.length);
    for(let i=0;i<farQuota;i++) farRubs.push(pool[(st.farPointer+i)%pool.length]);
    farCyclesApprox = Math.floor(st.farPointer/pool.length)+1;
  }

  const tomorrowIdx = st.nextMemoRubIndex + memoRubs.length;
  const tomorrowQuota = quotaOf(tomorrowIdx);
  const prepRubs=[];
  for(let i=0;i<tomorrowQuota && tomorrowIdx+i<=240;i++) prepRubs.push(tomorrowIdx+i);

  const isTomorrow = (st.planDate||todayStr()) > todayStr();
  return {
    day: st.sessionsCompleted+1, phase: phaseOf(st.nextMemoRubIndex),
    memoRubs, nearRubs, farRubs, prepRubs, farQuota, poolSize: pool.length, farCyclesApprox, isTomorrow, planDate:st.planDate||todayStr(),
  };
}

async function closeQuranDay(){
  const st = DB.quran;
  const today = computeQuranToday();
  if(!today) return;
  const c = st.todayChecks;
  if(!(c.memo && (today.nearRubs.length===0 || c.near) && (today.farRubs.length===0 || c.far) && c.prep)){
    toast('علّم كل المهام الأربعة الأول ✅');
    return;
  }
  // snapshot BEFORE mutating, so we can undo back to this exact point
  const snapshot = {
    nextMemoRubIndex: st.nextMemoRubIndex,
    completedRubs: st.completedRubs.slice(),
    lastSessionRubs: st.lastSessionRubs.slice(),
    farPointer: st.farPointer,
    sessionsCompleted: st.sessionsCompleted,
    finished: st.finished,
  };
  st.history.push({...snapshot, planDate:st.planDate||todayStr(), lastCompletedDate:st.lastCompletedDate||null});
  if(st.history.length>60) st.history.shift(); // cap history depth

  st.completedRubs = st.completedRubs.concat(today.memoRubs);
  st.lastSessionRubs = today.memoRubs;
  st.farPointer = today.poolSize>0 ? (st.farPointer + today.farQuota) % today.poolSize : 0;
  st.nextMemoRubIndex += today.memoRubs.length;
  st.sessionsCompleted += 1;
  st.todayChecks = { memo:false, near:false, far:false, prep:false };
  st.lastCompletedDate = todayStr();
  st.planDate = addDays(todayStr(),1);
  if(st.nextMemoRubIndex>240){ st.finished = true; }
  await save('quran');
  markActivity();
  const finishedJuz = today.memoRubs.some(r => QBY[r] && QBY[r].r2===4);
  if(st.finished){
    celebrate('🎉 ألف ألف مبروك! ختمت حفظ القرآن الكريم كامل! 🌙');
  } else if(finishedJuz){
    const j = QBY[today.memoRubs[today.memoRubs.length-1]].j;
    toast(`🌙 مبروك، خلّصت الجزء ${j}!`);
  } else {
    toast('أحسنت! يوم موفّق ✅');
  }
  renderTab('quran');
  renderTab('home');
}

async function undoLastQuranDay(){
  const st = DB.quran;
  if(!st.history || !st.history.length){ toast('مفيش أيام سابقة نرجع فيها'); return; }
  if(!await appConfirm('هيرجّعك ليوم الأمس، وهتقدر تعلّم عليه تاني لما تخلّصه فعلاً. متأكد؟')) return;
  const prev = st.history.pop();
  st.nextMemoRubIndex = prev.nextMemoRubIndex;
  st.completedRubs = prev.completedRubs;
  st.lastSessionRubs = prev.lastSessionRubs;
  st.farPointer = prev.farPointer;
  st.sessionsCompleted = prev.sessionsCompleted;
  st.finished = prev.finished;
  st.planDate = todayStr();
  st.lastCompletedDate = prev.lastCompletedDate||null;
  st.todayChecks = { memo:false, near:false, far:false, prep:false };
  await save('quran');
  toast('تم التراجع ↩️');
  renderTab('quran'); renderTab('home');
}

function enableHabitDragReorder(){
  const list = document.getElementById('habitsSortList');
  if(!list) return;
  let dragEl=null, startY=0, placeholder=null;
  list.querySelectorAll('.habit-drag-handle').forEach(handle=>{
    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      dragEl = handle.closest('.task-row');
      if(!dragEl) return;
      startY = e.clientY;
      dragEl.setPointerCapture && handle.setPointerCapture(e.pointerId);
      dragEl.classList.add('dragging');
      placeholder = document.createElement('div');
      placeholder.className='habit-drop-placeholder';
      placeholder.style.height = dragEl.offsetHeight+'px';
      dragEl.after(placeholder);
      document.body.style.userSelect='none';

      function onMove(ev){
        if(!dragEl) return;
        const dy = ev.clientY - startY;
        dragEl.style.transform = `translateY(${dy}px)`;
        dragEl.style.position='relative'; dragEl.style.zIndex='50';
        // find row we're hovering over to reposition placeholder
        const rows=[...list.querySelectorAll('.task-row:not(.dragging)')];
        for(const row of rows){
          const rect=row.getBoundingClientRect();
          const mid=rect.top+rect.height/2;
          if(ev.clientY < mid){ list.insertBefore(placeholder,row); break; }
          if(row===rows[rows.length-1]) list.appendChild(placeholder);
        }
      }
      function onUp(ev){
        document.removeEventListener('pointermove',onMove);
        document.removeEventListener('pointerup',onUp);
        if(!dragEl) return;
        dragEl.style.transform=''; dragEl.style.position=''; dragEl.style.zIndex='';
        dragEl.classList.remove('dragging');
        placeholder.replaceWith(dragEl);
        document.body.style.userSelect='';
        const newOrder=[...list.querySelectorAll('.task-row')].map(r=>r.dataset.habitId);
        DB.habits.sort((a,b)=>newOrder.indexOf(a.id)-newOrder.indexOf(b.id));
        save('habits');
        dragEl=null;
      }
      document.addEventListener('pointermove',onMove);
      document.addEventListener('pointerup',onUp);
    });
  });
}

function habitStreak(habitId){
  let streak=0, cursor=todayStr();
  if(!(DB.habitChecks[cursor]||{})[habitId]){ cursor = addDays(cursor,-1); if(!(DB.habitChecks[cursor]||{})[habitId]) return 0; }
  while((DB.habitChecks[cursor]||{})[habitId]){ streak++; cursor = addDays(cursor,-1); }
  return streak;
}
function habitBestStreak(habitId){
  const dates = Object.keys(DB.habitChecks).filter(d=>DB.habitChecks[d][habitId]).sort();
  if(!dates.length) return 0;
  let best=1, cur=1;
  for(let i=1;i<dates.length;i++){
    const prev = new Date(dates[i-1]+'T00:00:00');
    const curD = new Date(dates[i]+'T00:00:00');
    const diff = Math.round((curD-prev)/86400000);
    if(diff===1){ cur++; best=Math.max(best,cur); } else { cur=1; }
  }
  return Math.max(best,cur);
}
function habitTotalCompletions(habitId){
  return Object.values(DB.habitChecks).filter(day=>day[habitId]).length;
}

function weeklyHabitsChart(){
  const days = [];
  for(let i=6;i>=0;i--) days.push(addDays(todayStr(), -i));
  const names = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];

  days.forEach(d=>{
    const checks = DB.habitChecks[d]||{};
    const doneCount = DB.habits.filter(h=>checks[h.id]).length;
    const pct = DB.habits.length ? (doneCount/DB.habits.length*100) : 0;

    html += `<div class="col">

      <div class="fill" style="height:${Math.max(pct,4)}%;"></div>
      <div class="day-lbl">${names[dow]}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* ---- Habit detail: monthly calendar + stats ---- */
const MONTH_NAMES = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DOW_NAMES = ['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'];
const WEEKDAY_NAMES = ['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'];

function openHabitDetail(habitId){
  habitDetailId = habitId;
  const now = new Date();
  habitCalMonth = { y: now.getFullYear(), m: now.getMonth() };
  renderTab('habits');
}
function closeHabitDetail(){
  habitDetailId = null; habitCalMonth = null;
  renderTab('habits');
}
function shiftHabitCalMonth(delta){
  habitCalMonth.m += delta;
  if(habitCalMonth.m<0){ habitCalMonth.m=11; habitCalMonth.y--; }
  if(habitCalMonth.m>11){ habitCalMonth.m=0; habitCalMonth.y++; }
  renderTab('habits');
}

function ymdStr(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

function renderHabitDetail(habitId){
  const c = document.getElementById('content');
  const habit = DB.habits.find(h=>h.id===habitId);
  if(!habit){ habitDetailId=null; renderHabits(); return; }

  const { y, m } = habitCalMonth;
  const firstDay = new Date(y, m, 1);
  const startWeekday = (firstDay.getDay()+1)%7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const t = todayStr();

  let monthDone=0, monthTotalPassed=0;
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++){
    const ds = ymdStr(y,m,d);
    const done = !!(DB.habitChecks[ds]||{})[habitId];
    const isFuture = ds > t;
    const isToday = ds === t;
    if(!isFuture){ monthTotalPassed++; if(done) monthDone++; }
    cells.push({ d, done, isFuture, isToday });
  }
  const monthPct = monthTotalPassed ? Math.round(monthDone/monthTotalPassed*100) : 0;

  let html = `<div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
    <button class="icon-btn" onclick="closeHabitDetail()" style="background:var(--paper-2);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px;">→</button>
    <div style="font-weight:800; font-size:17px; flex:1;">${esc(habit.name)}</div>
  </div>`;

  html += `<div class="stat-grid" style="margin-bottom:16px;">
    <div class="stat-box"><div class="num">${monthPct}%</div><div class="lbl">نسبة الشهر</div></div>
    <div class="stat-box"><div class="num">${habitStreak(habitId)}</div><div class="lbl">🔥 حالي</div></div>
    <div class="stat-box"><div class="num">${habitBestStreak(habitId)}</div><div class="lbl">🏆 أفضل سلسلة</div></div>
    <div class="stat-box"><div class="num">${habitTotalCompletions(habitId)}</div><div class="lbl">إجمالي مرات</div></div>
  </div>`;

  html += `<div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
      <button class="icon-btn" onclick="shiftHabitCalMonth(1)" style="background:var(--paper-2);border:1px solid var(--line);border-radius:9px;width:32px;height:32px;cursor:pointer;">›</button>
      <div style="font-weight:800; font-size:15px; color:var(--green-deep);">${MONTH_NAMES[m]} ${y}</div>
      <button class="icon-btn" onclick="shiftHabitCalMonth(-1)" style="background:var(--paper-2);border:1px solid var(--line);border-radius:9px;width:32px;height:32px;cursor:pointer;">‹</button>
    </div>
    <div class="cal-grid">`;
  WEEKDAY_NAMES.forEach(w=> html += `<div class="cal-dow">${w}</div>`);
  cells.forEach(cell=>{
    if(!cell){ html += `<div class="cal-cell empty"></div>`; return; }
    let cls = 'cal-cell';
    if(cell.isFuture) cls += ' future';
    else if(cell.done) cls += ' done';
    else cls += ' missed';
    if(cell.isToday) cls += ' today';
    html += `<div class="${cls}">${cell.d}</div>`;
  });
  html += `</div>
    <div style="display:flex; gap:14px; margin-top:14px; font-size:11.5px; color:var(--muted); justify-content:center;">
      <span><span class="legend-dot done"></span> تم</span>
      <span><span class="legend-dot missed"></span> فات</span>
      <span><span class="legend-dot today"></span> النهاردة</span>
    </div>
  </div>`;

  c.innerHTML = html;
}

/* ---- Course smart scheduler: self-paced, based on daily available minutes ---- */
function courseScheduleHtml(course){
  if(!course.lessons.length) return '';
  if(!course.plan){
    return `<div class="schedule-card">
      <div style="font-weight:800; font-size:14px; margin-bottom:6px;">🧙 محتاج خطة يومية؟</div>
      <div style="font-size:12.5px; color:var(--muted); margin-bottom:12px; line-height:1.7;">قولّي كام دقيقة متاحة معاك يوميًا، وأنا أوزّعلك الدروس على الأيام وأقولك هتخلص إمتى.</div>
      <button class="btn btn-primary btn-block" onclick="openScheduleWizard('${course.id}')">اعمل خطة ذكية</button>
    </div>`;
  }
  const plan = course.plan;
  const remainingLessons = course.lessons.filter(l=>!l.done);
  if(!remainingLessons.length){
    return `<div class="schedule-card"><div style="font-weight:700; font-size:13.5px; color:var(--green-deep);">✅ خلّصت كل دروس الخطة، مبروك!</div></div>`;
  }
  const todaysLessons = remainingLessons.slice(0, plan.lessonsPerDay);
  const daysLeft = Math.ceil(remainingLessons.length / plan.lessonsPerDay);
  const finishDate = addDays(todayStr(), daysLeft-1);
  return `<div class="schedule-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div style="font-weight:800; font-size:14px;">📋 خطة النهاردة</div>
      <button class="btn btn-ghost btn-sm" onclick="openScheduleWizard('${course.id}')">تعديل الخطة</button>
    </div>
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:10px;">${plan.lessonsPerDay} ${plan.lessonsPerDay===1?'درس':'دروس'}/يوم بمعدّل ${plan.minutesPerDay} دقيقة — متوقع تخلص الكورس حوالي <b style="color:var(--green-deep)">${formatGoalDate(finishDate)}</b></div>
    <div style="font-size:12.5px; font-weight:700; margin-bottom:6px;">دلوقتي ركّز على:</div>
    ${todaysLessons.map(l=>`<div style="font-size:13px; padding:6px 10px; background:var(--paper); border-radius:9px; margin-bottom:6px;">• ${esc(l.title)}</div>`).join('')}
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="postponeCourseToday('${course.id}')">🕓 مش هينفع النهاردة، أجّل</button>
    </div>
  </div>`;
}

function openScheduleWizard(courseId){
  const course = DB.courses.find(c=>c.id===courseId);
  const existing = course.plan;
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>🧙 خطة ذكية لـ "${esc(course.name)}"</h3>
    <div style="font-size:12.5px; color:var(--muted); margin:-6px 0 10px;">كام دقيقة متاحة معاك للمذاكرة يوميًا؟</div>
    <input type="number" id="planMinutesDay" min="5" step="5" value="${existing?existing.minutesPerDay:30}" placeholder="مثال: 30">
    <div style="font-size:12.5px; color:var(--muted); margin:-6px 0 10px;">الدرس الواحد بياخد قد ايه تقريبًا (بالدقايق)؟</div>
    <input type="number" id="planMinutesLesson" min="1" step="1" value="${existing?existing.minutesPerLesson:20}" placeholder="مثال: 20">
    <div class="modal-btns"><button class="btn btn-ghost" id="planCancel">إلغاء</button><button class="btn btn-primary" id="planOk">${existing?'تحديث الخطة':'ابدأ الخطة'}</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const close = ()=> document.body.contains(overlay) && document.body.removeChild(overlay);
  overlay.querySelector('#planCancel').onclick = close;
  overlay.querySelector('#planOk').onclick = async ()=>{
    const minutesPerDay = Math.max(5, parseInt(overlay.querySelector('#planMinutesDay').value)||30);

    close();
    renderTab('courses');
    toast('تم إعداد خطتك 🧙');

function activityChart(numDays){
  const days=[]; for(let i=numDays-1;i>=0;i--) days.push(addDays(todayStr(),-i));
  let html = `<div class="week-bars" style="height:60px;">`;
  days.forEach(d=>{
    const active = !!DB.activityLog[d];
    html += `<div class="col"><div class="fill" style="height:${active?100:6}%; background:${active?'linear-gradient(180deg,var(--gold),var(--gold-deep))':'var(--line)'}"></div></div>`;
  });
  html += `</div>`;
  return html;
}

let statsMonth = null;
function shiftStatsMonth(delta){
  if(!statsMonth){ const n=new Date(); statsMonth={y:n.getFullYear(), m:n.getMonth()}; }
  statsMonth.m += delta;
  if(statsMonth.m<0){ statsMonth.m=11; statsMonth.y--; }
  if(statsMonth.m>11){ statsMonth.m=0; statsMonth.y++; }
  renderTab('stats');
}
function overallActivityCalendar(y,m){
  const firstDay = new Date(y,m,1);
  const startWeekday = (firstDay.getDay()+1)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const t = todayStr();
  let html = `<div class="cal-grid">`;
  WEEKDAY_NAMES.forEach(w=> html += `<div class="cal-dow">${w}</div>`);
  for(let i=0;i<startWeekday;i++) html += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = ymdStr(y,m,d);
    const isFuture = ds>t, isToday = ds===t;
    const pct = dayCompletionPct(ds);
    let cls='cal-cell';
    if(isFuture) cls+=' future';
    else if(pct===100) cls+=' done';
    else if(pct>0) cls+=' partial';
    else cls+=' missed';
    if(isToday) cls+=' today';
    html += `<div class="${cls}">${d}</div>`;
  }
  html += `</div>`;
  return html;
}
function habitConsistency30(habitId){
  const habit = DB.habits.find(h=>h.id===habitId);
  if(!habit) return 0;
  let total=0, done=0;
  const t = todayStr();
  for(let i=0;i<30;i++){
    const ds = addDays(t,-i);
    if(habit.createdAt && ds<habit.createdAt) continue;
    total++;
    if((DB.habitChecks[ds]||{})[habitId]) done++;
  }
  return total? Math.round(done/total*100) : 0;
}

const MONEY_GROUPS={
  essentials:[['🏠','سكن وفواتير'],['🍽️','أكل واحتياجات'],['🚕','مواصلات'],['❤️','صحة'],['📚','تعليم']],
  lifestyle:[['🎮','ترفيه'],['🛍️','مشتريات'],['☕','خروجات وقهوة'],['🎁','هدايا ومناسبات'],['📱','اشتراكات']],
  savings:[['🛟','صندوق طوارئ'],['🎯','هدف قريب'],['🏦','ادخار عام']],
  investment:[['📈','استثمار طويل الأجل'],['💼','استثمار في مشروع'],['📊','استثمار مالي']],
  other:[['💳','سداد ديون'],['🤲','صدقة/تبرع'],['📦','أخرى']],
};
const MONEY_INCOME_CATS=[['💼','راتب'],['💻','عمل حر'],['🏪','مشروع/تجارة'],['🎁','هدية'],['↩️','استرداد مبلغ'],['💰','دخل آخر']];
const MONEY_EXPENSE_CATS=[...MONEY_GROUPS.essentials,...MONEY_GROUPS.lifestyle,...MONEY_GROUPS.savings,...MONEY_GROUPS.investment,...MONEY_GROUPS.other];
let moneyView='overview', moneyModalType='expense';
const MONEY_WISDOM=[
 '🌿 الغنى الحقيقي مش في كثرة ما تملك، لكن في إن مالك يبقى في إيدك مش في قلبك.',
 '💚 اكسب بالحلال، وأنفق بعقل، وخلّي جزءًا من رزقك أمانًا لبكرة.',
 '🌱 المال نعمة؛ لما تديره بحكمة، يوسع قدرتك على الخير بدل ما يوسع قلقك.',
 '🤍 لا تجعل الزيادة في دخلك تسبق الزيادة في وعيك.',
 '💰 رتّب مالك قبل ما تطلب منه يحقق لك أحلامك.',
 '🧭 الكسب الطيب مع القناعة والانضباط أقوى من دخل كبير بلا خطة.'
];
function moneyWisdom(){return MONEY_WISDOM[dayOfYear()%MONEY_WISDOM.length];}

function moneyCatIcon(cat){const legacy={'استثمار':'📈','أهداف وادخار':'🎯'};return (MONEY_EXPENSE_CATS.find(x=>x[1]===cat)||MONEY_INCOME_CATS.find(x=>x[1]===cat)||[legacy[cat]||'💸','أخرى'])[0];}
function moneyGroup(cat){for(const [g,arr] of Object.entries(MONEY_GROUPS))if(arr.some(x=>x[1]===cat))return g;if(cat==='أهداف وادخار'||cat==='ادخار')return 'savings';if(cat==='استثمار')return 'investment';return 'other';}
function moneySummary(){const now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),tx=DB.money.transactions||[];const month=tx.filter(x=>String(x.date||'').startsWith(ym));const income=month.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount||0),0);const expense=month.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount||0),0);const allIncome=tx.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount||0),0);const allExpense=tx.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount||0),0);return{month,income,expense,balance:allIncome-allExpense,allIncome,allExpense};}
function moneyBudgetState(s){const b=DB.money.budget||{};const budget=Number(b.total||DB.money.monthlyBudget||0);const buckets={essentials:Number(b.essentials??45),lifestyle:Number(b.lifestyle??25),savings:Number(b.savings??15),investment:Number(b.investment??15)};const income=s.income||0;const allocation={};Object.keys(buckets).forEach(k=>allocation[k]=income*buckets[k]/100);const spent={essentials:0,lifestyle:0,savings:0,investment:0,other:0};const cats={};s.month.filter(x=>x.type==='expense').forEach(x=>{const v=Number(x.amount||0);cats[x.cat]=(cats[x.cat]||0)+v;const g=moneyGroup(x.cat);spent[g]=(spent[g]||0)+v;});const available={};Object.keys(buckets).forEach(k=>available[k]=allocation[k]-spent[k]);const used={};Object.keys(buckets).forEach(k=>used[k]=allocation[k]?spent[k]/allocation[k]*100:0);const groupCats={essentials:{},lifestyle:{},savings:{},investment:{},other:{}};s.month.filter(x=>x.type==='expense').forEach(x=>{const g=moneyGroup(x.cat);if(groupCats[g])groupCats[g][x.cat]=(groupCats[g][x.cat]||0)+Number(x.amount||0);});const usedBudget=budget?s.expense/budget*100:0;return{budget,buckets,income,allocation,spent,available,used,usedBudget,cats,groupCats};}
async function saveMoney(){await save('money');}
function openMoneyModal(type='expense',prefillCat=''){moneyModalType=type;const o=document.createElement('div');o.className='modal-overlay tx-modal';o.id='moneyTxOverlay';const cats=type==='income'?MONEY_INCOME_CATS:MONEY_EXPENSE_CATS;o.innerHTML=`<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">${type==='income'?'إضافة دخل':'تسجيل مصروف'}</h3><button class="icon-btn" id="mxClose">×</button></div><div class="money-type-tabs"><button class="money-type-tab ${type==='expense'?'active':''}" id="mxExp">− مصروف</button><button class="money-type-tab ${type==='income'?'active':''}" id="mxInc">＋ دخل</button></div><input id="mxAmount" class="feature-input" type="number" min="0" step="0.01" placeholder="المبلغ بالجنيه"><select id="mxCat" class="feature-input">${cats.map(x=>`<option value="${x[1]}" ${prefillCat===x[1]?'selected':''}>${x[0]} ${x[1]}</option>`).join('')}</select><input id="mxDate" class="feature-input" type="date" value="${todayStr()}"><input id="mxNote" class="feature-input" placeholder="${type==='income'?'مصدر الدخل (راتب، عمل، مشروع...)':'ملاحظة / سبب المصروف'}"><div class="money-income-note">${type==='income'?'بعد حفظ الدخل، التطبيق هيقسمه تلقائيًا على الأساسيات والترفيه والادخار والاستثمار حسب النسب اللي اخترتها.':'قبل الحفظ هنراجع سقف القسم اللي المصروف تابع له، عشان ما تتجاوزش المبلغ المخصص له.'}</div><button class="btn btn-primary btn-block" id="mxSave" style="margin-top:9px">حفظ المعاملة ✓</button></div>`;document.body.appendChild(o);const close=()=>o.remove();o.querySelector('#mxClose').onclick=close;o.querySelector('#mxExp').onclick=()=>{close();openMoneyModal('expense')};o.querySelector('#mxInc').onclick=()=>{close();openMoneyModal('income')};o.querySelector('#mxSave').onclick=async()=>{const amount=Number(o.querySelector('#mxAmount').value);if(!amount||amount<=0)return toast('اكتب مبلغ صحيح');const cat=o.querySelector('#mxCat').value;const date=o.querySelector('#mxDate').value;const tx={id:uid(),type,amount,cat,date,note:o.querySelector('#mxNote').value.trim(),createdAt:new Date().toISOString()};if(type==='expense'){const s=moneySummary();const bs=moneyBudgetState(s);const group=moneyGroup(cat);if(bs.buckets[group]){const available=bs.available[group];if(amount>available+0.0001){close();return toast(`المصروف أكبر من المتاح في قسم ${group==='essentials'?'الأساسيات':group==='lifestyle'?'الترفيه والمرونة':group==='savings'?'الادخار':'الاستثمار'} (${available.toFixed(0)} جنيه)`);}}}DB.money.transactions.unshift(tx);await saveMoney();close();renderMoney();toast(type==='income'?'اتسجل الدخل واتوزع تلقائيًا 💚':'اتسجل المصروف');};o.addEventListener('click',e=>{if(e.target===o)close()});o.querySelector('#mxAmount').focus();}
async function deleteMoney(id){DB.money.transactions=DB.money.transactions.filter(x=>x.id!==id);await saveMoney();renderMoney();}
function openMoneyGoalModal(){const o=document.createElement('div');o.className='modal-overlay';o.innerHTML=`<div class="modal"><h3>🎯 هدف ادخار جديد</h3><input id="mgName" class="feature-input" placeholder="اسم الهدف (صندوق طوارئ، لابتوب جديد...)"><input id="mgTarget" class="feature-input" type="number" min="0" step="0.01" placeholder="المبلغ المطلوب بالجنيه" style="margin-top:8px"><button class="btn btn-primary btn-block" id="mgSave" style="margin-top:10px">حفظ الهدف ✓</button></div>`;document.body.appendChild(o);o.addEventListener('click',e=>{if(e.target===o)o.remove()});o.querySelector('#mgSave').onclick=async()=>{const name=o.querySelector('#mgName').value.trim();const target=Number(o.querySelector('#mgTarget').value);if(!name)return toast('اكتب اسم الهدف');if(!target||target<=0)return toast('اكتب مبلغ صحيح');DB.money.goals.push({id:uid(),name,target,saved:0,createdAt:new Date().toISOString()});await saveMoney();o.remove();renderMoney();toast('اتحفظ الهدف 🎯');};}
async function addToMoneyGoal(id){const amount=Number(prompt('هتضيف كام جنيه للهدف ده؟')||0);if(!amount||amount<=0)return;const g=DB.money.goals.find(x=>x.id===id);if(!g)return;g.saved=(g.saved||0)+amount;await saveMoney();renderMoney();toast('تمام، اتضاف للهدف 💚');}

async function saveBudget(){const total=Number(document.getElementById('monthlyBudget').value)||0;let e=Number(document.getElementById('budgetEss').value)||45,l=Number(document.getElementById('budgetLife').value)||25,sav=Number(document.getElementById('budgetSav').value)||15,inv=Number(document.getElementById('budgetInv').value)||15;const sum=e+l+sav+inv;if(Math.abs(sum-100)>0.01)return toast('النسب لازم مجموعها يبقى 100%');DB.money.budget={total,essentials:e,lifestyle:l,savings:sav,investment:inv};DB.money.monthlyBudget=total;await saveMoney();renderMoney();toast('اتحفظ نظام الميزانية 🎯');}
function openMoneyGroup(group){
  const labels={essentials:'الأساسيات',lifestyle:'الترفيه',savings:'الادخار',investment:'الاستثمار'};
  const s=moneySummary(), bs=moneyBudgetState(s), label=labels[group]||group;

  const o=document.createElement('div');o.className='modal-overlay';o.innerHTML=`<div class="modal" style="max-width:470px;max-height:88vh;overflow:auto">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">${label}</h3><button class="icon-btn" id="mgClose">×</button></div>

  <button class="btn btn-primary btn-block" id="mgAdd">＋ تسجيل مصروف في ${label}</button>
  <div style="margin-top:14px">${tx.length?tx.slice(0,30).map(x=>`<div class="money-row"><div class="money-cat-icon">${moneyCatIcon(x.cat)}</div><div class="grow"><b>${esc(x.cat)}</b><div style="font-size:10px;color:var(--muted)">${esc(x.date)}${x.note?' • '+esc(x.note):''}</div></div><b style="color:var(--danger)">−${Number(x.amount).toFixed(0)}</b></div>`).join(''):'<div class="money-empty">مفيش مصروفات في القسم ده لسه.</div>'}</div>
  </div>`;
  document.body.appendChild(o);o.querySelector('#mgClose').onclick=()=>o.remove();o.querySelector('#mgAdd').onclick=()=>{o.remove();openMoneyModal('expense',MONEY_GROUPS[group]?.[0]?.[1]||'')};o.addEventListener('click',e=>{if(e.target===o)o.remove()});

  if(moneyView==='overview'){

async function requestNotifications(silent){if('Notification' in window){try{if(Notification.permission==='default'){const p=await Notification.requestPermission();if(!silent)toast(p==='granted'?'الإشعارات اتفعلت 🔔':'الإشعارات مرفوضة من الجهاز');}else if(!silent){toast(Notification.permission==='granted'?'الإشعارات شغالة 🔔':'الإشعارات مرفوضة من إعدادات الجهاز');}}catch(e){if(!silent)toast('الإشعارات غير متاحة في البيئة الحالية')}}if(window.Android&&typeof window.Android.requestNotificationPermission==='function'){try{window.Android.requestNotificationPermission()}catch(e){}}}

function fireNotification(title,body,tag){
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.controller){
      navigator.serviceWorker.controller.postMessage({type:'SHOW_NOTIFICATION',payload:{title,body,tag}});
      return;
    }
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,{body,tag,vibrate:[200,100,200],requireInteraction:true,dir:'rtl',lang:'ar'})).catch(()=>{
        if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body});
      });
      return;
    }
  }catch(e){}
  if('Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch(e){}}
}

function scheduleReminderNotifications(){
  if(window.__reminderTimers)window.__reminderTimers.forEach(clearTimeout);
  window.__reminderTimers=[];
  if(!window.__firedReminders)window.__firedReminders=new Set();
  DB.reminders.filter(r=>!r.done).forEach(r=>{
    const due=new Date(r.date+'T'+r.time).getTime(),ms=due-Date.now();
    if(window.Android&&typeof window.Android.scheduleReminder==='function'){try{window.Android.scheduleReminder(JSON.stringify(r))}catch(e){}}
    if(ms<=0||ms>2147483647)return;
    window.__reminderTimers.push(setTimeout(()=>{
      if(window.__firedReminders.has(r.id))return;
      window.__firedReminders.add(r.id);
      fireNotification('مُعِين — تذكير',r.title+(r.note?' • '+r.note:''),'reminder-'+r.id);
    },ms));
  });
}

// Safety net: browsers throttle/suspend timers in background tabs, so re-check every 20s
// for anything that became due (within the last 3 minutes) but never fired, and catch it up.
function checkDueReminders(){
  if(!window.__firedReminders)window.__firedReminders=new Set();
  const now=Date.now();
  DB.reminders.filter(r=>!r.done).forEach(r=>{
    const due=new Date(r.date+'T'+r.time).getTime();
    if(due<=now&&now-due<180000&&!window.__firedReminders.has(r.id)){
      window.__firedReminders.add(r.id);
      fireNotification('مُعِين — تذكير',r.title+(r.note?' • '+r.note:''),'reminder-'+r.id);
    }
  });
}

  'مطمئن':[
   ['قرآن','أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ','الرعد: 28','في الهدوء اللي حاسس بيه دلوقتي نعمة تستاهل تتحفظ. متجريش منها؛ خليك لحظة مع ربنا واشكره إن قلبك لاقى مكان يهدأ فيه.'],
   ['قرآن','فَإِنَّ مَعَ الْعُسْرِ يُسْرًا','الشرح: 5','خلي الطمأنينة دي مش بس راحة؛ خليها ثقة. اللي فاتك مش لازم يحدد اللي جاي، وربنا يفتح من الضيق بابًا ماكنتش شايفه.'],
   ['قرآن','وَإِلَىٰ رَبِّكَ فَارْغَب','الشرح: 8','طالما قلبك هادي، حط فيه طلبًا جميلًا. اتمنى من ربنا، واسعَ بهدوء، ومتعتبرش إن الهدوء معناه توقف؛ أحيانًا هو أفضل نقطة تبدأ منها.'],
   ['حديث','إن الله لا ينظر إلى صوركم وأموالكم ولكن ينظر إلى قلوبكم وأعمالكم','مسلم','خليك مطمئن إن قيمتك مش متعلقة بالشكل اللي بتظهر بيه ولا باللي في إيدك. ربنا شايف قلبك وسعيك، وده كفاية يخلّي الواحد أهدى.'],
   ['موقف','خديجة رضي الله عنها وقت بداية الوحي','السيرة','في أول لحظة كان الحمل أكبر من الاحتمال، وكانت كلمة خديجة سندًا حقيقيًا: أنت لست وحدك. أحيانًا الطمأنينة تأتي من شخص يصدق فيك حين أنت نفسك لا تعرف ماذا تقول.'],
   ['حديث','دعوة ذي النون: لا إله إلا أنت سبحانك إني كنت من الظالمين','الترمذي','في ساعة الرضا والهدوء، كرر الدعوة دي شكرًا لا استغاثة بس. القلب الهادي أفضل وقت يتربى فيه على التسبيح.'],
   ['موقف','ثبات النبي ﷺ وهدوؤه في غزوة حنين بعد لحظة تفرق الصفوف','السيرة','السكينة الحقيقية ظهرت وقت الفوضى نفسها، مش بعدها. لو حاسس بهدوء دلوقتي، خزّنه؛ هيلزمك في يوم مش هادي زيه.'],
   ['حكمة','السكينة لا تعني أن كل شيء انتهى؛ تعني أنك لم تعد محتاجًا أن تعرف كل شيء الآن.','تأمل','احتفظ بالهدوء ده. مش لازم تحل بكرة الليلة. يكفي إنك تعرف خطوتك الجاية وتسيب باقي الطريق على ربنا.']
  ],
  'حزين':[
   ['قرآن','لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا','التوبة: 40','عارف إن الحزن ساعات يخليك حاسس إنك لوحدك في المكان كله. بس وجود الألم مش دليل إن ربنا سايبك؛ ممكن تكون أقرب لحظة تحتاج فيها تحس بمعيته. خُدها واحدة واحدة.'],
   ['قرآن','مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَى','الضحى: 3','لو حاجة وجعتك وخليتك تسأل: هو ليه؟ افتكر إن التأخر مش هجر، والصمت مش رفض. في أوقات ربنا يربي قلبك في المسافة قبل ما يريك الفرج.'],
   ['قرآن','إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ','يوسف: 86','مش مطلوب منك تكتم حزنك عشان تبان قوي. احكي لربنا بكل اللي جواك، حتى الجزء اللي مش عارف تشرحه. الشكوى إليه مش ضعف؛ دي رجعة لمكان آمن.'],
   ['حديث','عجبًا لأمر المؤمن إن أمره كله له خير','مسلم','مش كل حاجة موجعة معناها إن نهايتها شر. في حاجات بتوجعك دلوقتي وتطلع بعدين إنها غيرت فيك حاجة كانت لازم تتغير. متستعجلش الحكم على القصة وهي لسه بتتكتب.'],
   ['موقف','النبي ﷺ عند وفاة ابنه إبراهيم','السيرة','النبي نفسه بكى وقال إن العين تدمع والقلب يحزن. يعني الحزن مش ضد الإيمان. إنت ممكن تكون مؤمن ومكسور في نفس الوقت؛ الاتنين يقدروا يعيشوا مع بعض.'],
   ['حديث','ما أصاب المؤمن من نصب ولا وصب ولا هم ولا حزن... إلا كفّر الله بها من خطاياه','متفق عليه','حزنك النهارده مش بيروح فاضي. حتى في أصعب لحظاته، فيه رحمة بتشتغل وإنت مش شايفها.'],
   ['موقف','بكاء النبي ﷺ عند قبر أمه ﷺ واستئذانه بزيارته','مسلم','الحزن على من نحب مش نقص في اليقين. النبي نفسه بكى بحرقة عند قبر أمه، وده يعلّمنا إن الوجع على الفقد مقام إنساني شريف.'],
   ['حكمة','مش لازم تبقى بخير طول الوقت عشان تبقى ماشي في الطريق الصح.','تأمل','النهارده ممكن يكون يوم نجاة مش يوم إنجاز. كل اللي عليك تحافظ على نفسك، وتصلي، وتأكل، وتنام، وتسيب قلبك ياخد مساحته.']
  ],
  'قلقان':[
   ['قرآن','وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ','الطلاق: 3','إنت مش مطالب تضمن النتيجة عشان تتحرك. اعمل اللي عليك، وسيب الجزء اللي مش في إيدك لربنا. القلق بيطلب منك تسيطر على كل حاجة؛ التوكل يعلمك تعمل اللي تقدر عليه وبعدين تسلّم.'],
   ['قرآن','إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ','الشعراء: 62','حتى لما البحر قدامك والطريق باين مقفول، مش لازم تكون عارف هتخرج إزاي. كفاية تعرف إن ربنا معاك وإنه قادر يفتح طريق من حيث لا تتوقع.'],
   ['قرآن','فَاذْكُرُونِي أَذْكُرْكُمْ','البقرة: 152','لما دماغك تفضل تلف، ارجع للحظة دي. ذكر بسيط، نفس هادي، وصلاة. مش عشان تهرب من المشكلة، لكن عشان تواجهها بقلب مش متبعثر.'],
   ['حديث','احفظ الله يحفظك','الترمذي','متخلّيش الخوف من المستقبل يخليك تنسى ربنا في الحاضر. احفظ علاقتك بيه في اللحظة دي، وخلي الخطوة الجاية هي كل اللي مطلوب منك الآن.'],
   ['موقف','موقف النبي ﷺ مع أبي بكر في الغار','السيرة','في لحظة كان فيها الخطر قريبًا جدًا، جاء الاطمئنان من معنى بسيط: لا تحزن إن الله معنا. أحيانًا القلب محتاج يسمع إن وجود الخوف لا يعني غياب الحماية.'],
   ['حديث','لا يصيب المسلم من نصب ولا وصب... حتى الشوكة يشاكها إلا كفّر الله بها من خطاياه','متفق عليه','حتى القلق الصغير اللي بيوجعك مش بيضيع. حاول تشوفه بعين تانية بدل ما تقاومه بس.'],
   ['موقف','قلق أم موسى عليها السلام وهي تلقي ابنها في اليم','القصص: 7-10','ربنا ربط على قلبها في أخطر لحظة ممكن تعيشها أم. لو قلقك على حد بتحبه، اطلب نفس الربط ده: اللهم اربط على قلبي.'],
   ['حكمة','القلق يعيش في المستقبل؛ أما الخطوة التي تقدر تعملها الآن فهي في إيدك.','تأمل','اكتب أسوأ حاجة خايف منها، وبعدها اكتب أصغر تصرف تقدر تعمله النهارده. سيب المجهول للمجهول، وامسك في الجزء اللي تقدر تتحكم فيه.']
  ],
  'مضغوط':[
   ['قرآن','لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا','البقرة: 286','مش كل الحمل لازم يتشال مرة واحدة. خُد حاجة واحدة بس دلوقتي. ربنا ما طلبش منك تعيش الأسبوع كله في ساعة واحدة.'],
   ['قرآن','فَإِذَا فَرَغْتَ فَانصَبْ ۝ وَإِلَىٰ رَبِّكَ فَارْغَب','الشرح: 7-8','حتى بعد الإنجاز، القلب محتاج يرجع لمصدره. متحوّلش يومك لسلسلة مهام من غير نفس. اعمل، واهدأ، وارجع لربنا، وبعدين كمل.'],
   ['قرآن','وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ','البقرة: 45','لما كل حاجة تبان مستعجلة، الصلاة بتفكك الزحمة من جواك. مش لازم تحل كل شيء الآن؛ خُد لحظة تعيد فيها ترتيب نفسك.'],
   ['حديث','إن لنفسك عليك حقًا','البخاري','إنت مش آلة إنتاج. لنفسك حق في الراحة والنوم والأكل والهدوء. الاهتمام بنفسك مش تعطيل للخطة؛ ده جزء من القدرة إنك تكملها.'],
   ['موقف','تقسيم النبي ﷺ للأعمال على قدر الاستطاعة','السيرة','كان في عبادة وعمل ومسؤوليات، لكن الطريق لم يكن مبنيًا على استنزاف النفس بلا نهاية. خد من اليوم ما تستطيع، واستمر بدل ما تحرق نفسك ثم تنقطع.'],
   ['حديث','يسّروا ولا تعسّروا، وبشّروا ولا تنفّروا','متفق عليه','متطلبش من نفسك الكمال في يوم مضغوط. يكفي إنك تكمل بطريقة سهلة، مش مثالية.'],
   ['موقف','تفويض النبي ﷺ للمهام على أصحابه بدل ما يحملها كلها لوحده','السيرة','ما كانش بيعمل كل حاجة بنفسه. فوّض، ووزّع، وثق في غيره. لو الضغط زاد عليك، اسأل: مين ممكن يساعدني في جزء من ده؟'],
   ['حكمة','الضغط يقل لما تحول الفوضى إلى أول خطوة واضحة.','تأمل','اقفل عشر تبويبات في دماغك واكتب مهمة واحدة فقط. خلصها، وبعدها قرر. أحيانًا اللي محتاجينه مش وقت أكتر؛ محتاجين ترتيب أكتر.']
  ],
  'تايه':[
   ['قرآن','فَاسْتَقِمْ كَمَا أُمِرْتَ','هود: 112','مش لازم تشوف الطريق كله. لو عارف اتجاه الصح، خُد الخطوة اللي قدامك. الوضوح أحيانًا بيظهر بعد الحركة، مش قبلها.'],
   ['قرآن','وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا','العنكبوت: 69','الهداية مش دايمًا خريطة كاملة. أحيانًا ربنا يفتح لك الطريق وأنت ماشي فيه بصدق. اتحرك في الاتجاه الصح، وسيب التفاصيل تظهر واحدة واحدة.'],
   ['قرآن','وَقُل رَّبِّ زِدْنِي عِلْمًا','طه: 114','لو تايه لأنك مش عارف، متجلدش نفسك. قول يا رب علّمني. سؤال واحد صادق ممكن يفتح لك بابًا أكبر من ألف محاولة مشتتة.'],
   ['حديث','إذا قامت الساعة وفي يد أحدكم فسيلة فليغرسها','أحمد','حتى لو الصورة الكبيرة مش واضحة، لسه فيه فعل صغير له معنى. اعمل اللي تقدر عليه الآن، ومتخليش غموض المستقبل يسرق منك الحاضر.'],
   ['موقف','هجرة النبي ﷺ والتخطيط للطريق','السيرة','التوكل مش معناه تمشي من غير خطة. النبي ﷺ أخذ بالأسباب، اختار الطريق، وخبّأ الأثر. إيمانك لا يمنع التخطيط؛ بالعكس، يخليك تخطط من غير ما تعبد النتيجة.'],
   ['حديث','من سلك طريقًا يلتمس فيه علمًا سهّل الله له به طريقًا إلى الجنة','مسلم','لو تايه في اتجاهك، اطلب العلم اللي ناقصك بدل ما تفضل تلف. سؤال، كتاب، أو حد يعرف أكتر منك، كل ده طريق.'],
   ['موقف','حيرة عمر بن الخطاب رضي الله عنه قبل إسلامه ثم وضوح الطريق فجأة','السيرة','أعتى القلوب حيرة ممكن تتحول لأوضح يقين في لحظة. متيأسش من التوهان الحالي؛ ممكن يكون آخر خطوة قبل الوضوح.'],
   ['حكمة','لو مش عارف كل الطريق، اختار على الأقل الاتجاه الذي لن تندم عليه.','تأمل','اسأل نفسك: أي قرار لو عملته هكون أقرب للشخص اللي عايز أبقى عليه؟ غالبًا الإجابة دي هتديك أول خطوة.']
  ],
  'وحيد':[
   ['قرآن','وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ الْوَرِيدِ','ق: 16','إحساسك بالوحدة حقيقي، بس مش معناه إنك متروك. احكي لربنا من غير ترتيب، وبعدها ابعت لشخص أمين حتى لو بكلمة: محتاج أتكلم.'],
   ['قرآن','فَاذْكُرُونِي أَذْكُرْكُمْ','البقرة: 152','اعمل لنفسك ركن صغير مع ربنا النهارده. وبعدها افتح بابًا مع إنسان بتحبه. القلب محتاج الأنس بالله، ومحتاج كمان صحبة إنسانية صادقة.'],
   ['قرآن','إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ','الحجرات: 10','مش لازم تستنى الناس تلاحظ إنك محتاجهم. اطلب القرب. كلمة بسيطة منك ممكن تفتح بابًا كنت فاكره مقفول.'],
   ['حديث','المرء على دين خليله','الترمذي','اختيار الصحبة مش رفاهية. لو الوحدة بتضغط عليك، دور على شخص وجوده يقرّبك للخير ويخلي الكلام أسهل، حتى لو التواصل بسيط.'],
   ['موقف','مواساة النبي ﷺ لأصحابه في الشدائد','السيرة','النبي كان يعرف إن الكلمة الطيبة وقت الضيق ممكن تسند إنسانًا. لو محتاج سند، متكسفش تطلبه. وإنت كمان تقدر تكون السند لحد تاني.'],
   ['حديث','مثل المؤمنين في توادهم وتراحمهم كمثل الجسد الواحد','متفق عليه','إنت جزء من جسد أكبر، حتى لو حاسس إنك مقطوع عنه دلوقتي. مد إيدك بكلمة، والجسد بيحس بيك.'],
   ['موقف','وحشة النبي ﷺ الأولى في غار حراء قبل نزول الوحي','السيرة','حتى أعظم إنسان مر بلحظة عزلة قبل ما يجيله الأنس. الوحدة مش دايمًا نهاية؛ أحيانًا هي تمهيد لشيء أكبر جاي.'],
   ['حكمة','أحيانًا أول خطوة للخروج من الوحدة ليست أن تجد الشخص المناسب؛ بل أن تسمح لنفسك أن تقول: أنا محتاج حد.','تأمل','متعتبرش الاحتياج عيب. قولها لشخص تثق فيه. القرب يبدأ غالبًا من جملة صغيرة جدًا.']
  ],
  'غاضب':[
   ['قرآن','وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ','آل عمران: 134','متاخدش قرار وإنت مولّع. ابعد شوية، سيب جسمك يهدى، وبعدها قرر. ضبط الغضب مش ضعف؛ ده إنك متديش للحظة سلطة على حياتك.'],
   ['قرآن','وَلْيَعْفُوا وَلْيَصْفَحُوا','النور: 22','العفو مش معناه إن اللي حصل صح. أحيانًا معناه إنك قررت إن الغلط مش هيفضل ساكن جواك وياخد من يومك أكتر مما أخد.'],
   ['قرآن','ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ','فصلت: 34','لو تقدر ترد بطريقة أهدى وأقوى من العصبية، اعمل كده. مش عشان الطرف التاني يستاهل؛ عشان إنت تستاهل تخرج من الموقف محافظ على نفسك.'],
   ['حديث','ليس الشديد بالصرعة، إنما الشديد الذي يملك نفسه عند الغضب','متفق عليه','القوة الحقيقية مش في إنك تكسب الخناقة. القوة إنك تملك اللحظة اللي جواك وتختار ردًا مش هتندم عليه بعد ما تهدى.'],
   ['موقف','وصية النبي ﷺ للرجل: لا تغضب','البخاري','الجملة قصيرة جدًا، لكنها عميقة: مش كل إحساس لازم يتحول لفعل. ادي لنفسك مساحة قبل الرد، ويمكن نصف المشكلة يختفي وحده.'],
   ['حديث','لا تغضب، ولا تغضب، ولا تغضب','البخاري','النبي ﷺ كررها ثلاث مرات لرجل طلب وصية جامعة. لو ملخصك الغضب دلوقتي، ارجع للجملة البسيطة دي.'],
   ['موقف','عفو النبي ﷺ عن أهل مكة يوم الفتح رغم كل الأذى اللي عملوه','السيرة','كان قادر ينتقم وهو في أقوى موقف، لكنه اختار العفو. القوة الحقيقية بتظهر في لحظة القدرة على الرد، مش لحظة العجز.'],
   ['حكمة','الغضب يطلب ردًا سريعًا؛ الحكمة تطلب منك عشر ثواني إضافية.','تأمل','متكتبش الرسالة دلوقتي. متاخدش القرار دلوقتي. خد عشر دقايق، وبعدها ارجع شوف نفس الموقف بعين أهدى.']
  ],
  'محبط':[
   ['قرآن','وَلَا تَهِنُوا وَلَا تَحْزَنُوا','آل عمران: 139','الإحباط بيقولك إن اللحظة دي هي النهاية. مش لازم تصدقه. خُد خطوة صغيرة جدًا، حتى لو مش حاسس بأمل، وسيب الحركة تسبق الشعور.'],
   ['قرآن','وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ','يوسف: 87','متخليش يوم وحش يتحول لحكم على مستقبلك كله. الفرج مش لازم يكون واضحًا عشان يكون ممكنًا.'],
   ['قرآن','فَإِنَّ مَعَ الْعُسْرِ يُسْرًا','الشرح: 5','اليسر مش وعد إن كل شيء هيختفي فورًا؛ هو تذكير إن العسر مش المشهد الوحيد. سيب مساحة لشيء جديد يدخل حياتك.'],
   ['حديث','المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كل خير','مسلم','القوة مش إنك متقعش. القوة إنك تقوم كل مرة بشكل أهدى وأوعى. النهارده لو قدرت تعمل 10%، اعملهم ومتحقرهمش.'],
   ['موقف','طريق النبي ﷺ في الطائف ثم العودة بالدعوة','السيرة','الرفض والأذى ماكانوش آخر القصة. أحيانًا الباب اللي اتقفل قدامك مش معناه إن الطريق انتهى؛ يمكن بس معناه إنك محتاج تكمل من باب تاني.'],
   ['حديث','واعلم أن النصر مع الصبر، وأن الفرج مع الكرب، وأن مع العسر يسرًا','الترمذي','ده مش كلام عزاء عام؛ ده قاعدة. اللي إنت فيه دلوقتي متلازم مع فرج جاي، حتى لو مش شايفه.'],
   ['موقف','إحباط النبي ﷺ بعد رفض قومه ثم استقبال الأنصار له لاحقًا','السيرة','باب اتقفل بقسوة، وبعده انفتح باب أوسع منه بكتير. مش كل رفض نهاية؛ أحيانًا هو تحويلة لطريق أفضل.'],
   ['حكمة','النتيجة المتأخرة ليست دائمًا نتيجة سيئة؛ أحيانًا أنت فقط في منتصف القصة.','تأمل','متقيّمش نفسك من صفحة واحدة. بص على المسافة اللي قطعتها، وحدد خطوة صغيرة ترجعك للحركة.']
  ],
  'ممتن':[
   ['قرآن','لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ','إبراهيم: 7','خلي الامتنان يتحول لحركة: احمد ربنا، استخدم النعمة صح، وخلي منها نصيب لحد غيرك. النعمة لما تتحول لخير بتكبر في معناها.'],
   ['قرآن','فَاذْكُرُونِي أَذْكُرْكُمْ','البقرة: 152','أجمل رد على الفرح إنك تفتكر صاحب الفضل. خُد لحظة هادية تقول فيها الحمد لله بصدق، من غير ما تستعجل على اللي بعد اللحظة.'],
   ['قرآن','وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ','الضحى: 11','اتكلم عن النعمة بشكر مش استعراض. افتكر مين رزقك بيها، وخلي فرحتك تفتح مساحة لخير جديد.'],
   ['حديث','من لا يشكر الناس لا يشكر الله','الترمذي','لو حد كان سببًا في خير وصل لك، قوله. الامتنان مش إحساس داخلي بس؛ أحيانًا كلمة شكر بتصلح علاقة كاملة.'],
   ['موقف','شكر النبي ﷺ لربه مع كثرة عبادته','السيرة','لما يكون عندك خير، متتعاملش معاه كأنه شيء مضمون. الشكر الحقيقي يخلي النعمة سببًا في قربك، مش سببًا في غفلتك.'],
   ['حديث','انظروا إلى من هو أسفل منكم ولا تنظروا إلى من هو فوقكم، فهو أجدر ألا تزدروا نعمة الله عليكم','متفق عليه','النعمة اللي عندك دلوقتي حد تاني بيدعي عشانها. خد لحظة تشوفها بعين اللي مش عنده، مش بعين اللي عنده أكتر.'],
   ['موقف','شكر النبي ﷺ الطويل حتى تورمت قدماه في قيام الليل رغم مغفرة ذنبه','متفق عليه','لما سألوه ليه يتعب نفسه وهو مغفور له، قال: أفلا أكون عبدًا شكورًا؟ الشكر مش رد فعل على نقص؛ هو أسلوب حياة حتى وسط النعمة الكاملة.'],
   ['حكمة','الامتنان لا يغير ما تملك فقط؛ يغير عينك على ما تملك.','تأمل','قبل ما تنام، سمّي ثلاث حاجات بسيطة جدًا حصلت النهارده. مش لازم تكون كبيرة. مجرد رؤيتها بوضوح بيغير شكل اليوم.']
  ],
  'فرحان':[
   ['قرآن','قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا','يونس: 58','افرَح يا صاحبي. وخلي فرحتك مربوطة بالشكر. شارك منها حد، اعمل خير، وخلي اللحظة دي تسيب أثرًا أبعد منك.'],
   ['قرآن','وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ','الضحى: 11','استمتع باللحظة من غير ذنب. احمد ربنا عليها، وخليها وقودًا لعمل كويس بدل ما تكون مجرد لحظة وتعدي.'],
   ['قرآن','فَاذْكُرُونِي أَذْكُرْكُمْ','البقرة: 152','خلي أول رد فعل على الفرح: الحمد لله. وبعدين كمل يومك بقلب خفيف من غير ما تحس إنك لازم تبرر سعادتك لحد.'],
   ['حديث','تبسمك في وجه أخيك صدقة','الترمذي','فرحتك مش بس ليك. لما تبقى مبسوط، ابسط اللي حواليك. الفرح بينتشر زي العدوى الحلوة.'],
   ['موقف','فرح النبي ﷺ ببشارة أو نصر مع شكر الله','السيرة','الفرح في الإسلام مش عيب. الجميل إن الفرحة نفسها تفضل مربوطة بمعنى أكبر من مجرد المكسب اللحظي.'],
   ['حديث','أحب الأعمال إلى الله أدومها وإن قل','متفق عليه','لو فرحان إنك بدأت حاجة حلوة، متستناش الحماس وحده. خُد من الفرحة قرارًا صغيرًا يستمر معاك بعد ما الحماس يهدى.'],
   ['حديث','أحب الأعمال إلى الله أدومها وإن قل','متفق عليه','لو فرحان إنك بدأت حاجة حلوة، متستناش الحماس وحده. خُد من الفرحة قرارًا صغيرًا يستمر معاك بعد ما الحماس يهدى.'],
   ['موقف','فرحة النبي ﷺ الظاهرة في وجهه عند البشائر مع سجوده شكرًا لله','السيرة','كان يعبّر عن فرحه بصدق، وفي نفس اللحظة يسجد شكرًا. الفرح والعبادة مش خصمين؛ ممكن يعيشوا مع بعض في نفس اللحظة.'],
   ['حكمة','الفرح أجمل لما يكون عنده اتجاه: يوسع قلبك ويترك أثرًا في غيرك.','تأمل','استمتع. وبعدين اسأل نفسك: إيه الخير اللي ممكن أطلعه من الفرحة دي؟ هتلاقي إن اللحظة ممكن تكبر جدًا.']
  ],
  'متعب':[
   ['قرآن','لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا','البقرة: 286','إنت مش ماكينة. لو جسمك ونفسك طالبين راحة، خدها من غير جلد ذات. الراحة مش عكس الاستمرار؛ هي اللي بتحافظ عليه.'],
   ['قرآن','وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا','النبأ: 9','ممكن أقرب حل الليلة بسيط: مية، أكل، تقليل شاشة، ونوم محترم. مش كل تعب محتاج قرار كبير.'],
   ['قرآن','وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ','البقرة: 45','خد نفس، صلّي، وبعدها شوف أقل خطوة ممكن تعملها. النهارده مش لازم يكون يوم بطولات؛ ممكن يكون يوم حفاظ على نفسك.'],
   ['حديث','إن لنفسك عليك حقًا','البخاري','مش مطلوب منك تدي كل طاقتك لكل حاجة. لنفسك حق، والاعتراف بالتعب أحيانًا أذكى من تجاهله.'],
   ['موقف','النبي ﷺ كان يراعي أحوال الناس في العبادة','السيرة','الطاقة لها حدود. حتى العبادة والعمل كانوا يُراعى فيهم حال الناس. خليك رحيم بنفسك من غير ما تسيب الطريق.'],
   ['حديث','فإذا فرغت فانصب، وإلى ربك فارغب','تأمل من القرآن، مذكور بلفظ آخر في السنة عن راحة النفس','التعب مش دايمًا محتاج توقف كامل؛ أحيانًا محتاج تغيير نوع النشاط: من مجهود جسدي لمجهود روحي بسيط زي الذكر.'],
   ['موقف','قيلولة النبي ﷺ وسط اليوم واهتمامه بالراحة رغم كثرة مسؤولياته','السيرة','الراحة مش رفاهية في سيرة النبي؛ كانت جزء من نظام يومه. لو حاسس بالذنب وإنت مرتاح، افتكر إن ده سنة مش تقصير.'],
   ['حكمة','الراحة ليست مكافأة بعد أن تنتهي؛ أحيانًا هي الوقود الذي يجعلك تنتهي أصلًا.','تأمل','اختار حاجة واحدة تريحك بصدق الليلة، واعملها من غير إحساس بالذنب. بكرة محتاج منك نسخة أهدى، مش نسخة منهكة.']

  'غير ذلك':[
   ['قرآن','أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ','الرعد: 28','قول اللي جواك زي ما هو، من غير ما ترتبه. قلبك مش محتاج تمثل عليه القوة؛ محتاج مساحة آمنة ترجع فيها لربنا.'],
   ['قرآن','وَإِلَىٰ رَبِّكَ فَارْغَب','الشرح: 8','لو مش عارف تسمي إحساسك، عادي. مش لازم تلاقي الاسم الصح قبل ما تطلب العون. قول يا رب أنا مش فاهم نفسي، بس إنت فاهمني.'],
   ['قرآن','إِنَّ مَعَ الْعُسْرِ يُسْرًا','الشرح: 5','مش لازم تشرح كل حاجة دلوقتي. خطوة هادية، دعاء بسيط، ووقت لنفسك. واحدة واحدة.'],
   ['حديث','إنما الأعمال بالنيات','متفق عليه','حتى لو اليوم ملخبط، نيتك تقدر تكون نقطة بداية. اختار نية واحدة صادقة وخليها تقود الخطوة اللي جاية.'],
   ['موقف','النبي ﷺ كان يسأل أصحابه ويستمع لهم','السيرة','مش كل موقف محتاج إجابة فورية. أحيانًا أول ما يحتاجه الإنسان إن حد يسمعه فعلًا. وإنت من حقك تاخد المساحة دي.'],
   ['حديث','التأني من الله والعجلة من الشيطان','الطبراني (بمعناه)','مش لازم تفهم أو تحسم كل حاجة دلوقتي. خد وقتك، حتى في فهم نفسك.'],
   ['موقف','سؤال الرجل النبي ﷺ: أي الأعمال أفضل؟ فأجابه بما يناسب حاله هو تحديدًا','السيرة','النبي ﷺ كان بيجاوب كل واحد بما يناسبه، مش بإجابة واحدة جاهزة للكل. إحساسك مهما كان غامض، يستاهل إجابة تخصك إنت.'],
   ['حكمة','مش لازم تفهم شعورك كله عشان تبدأ تتعامل معاه بلطف.','تأمل','سمّيه بأقرب كلمة، أو حتى قول: مش عارف. وبعدها اسأل: إيه أصغر حاجة ممكن تخليني أحسن 1%؟']

// حوض إضافي من آيات السكينة والتفريج، مشترك بين كل المشاعر — عشان يبقى فيه تنويع كبير جدًا

 ['قرآن','وَبَشِّرِ الصَّابِرِينَ','البقرة: 155','ربنا خص الصابرين ببشارة مباشرة منه. صبرك النهارده مش بيروح هدر؛ هو مكتوب وله بشارة إنت لسه ماشايفهاش.'],
 ['قرآن','وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ','الحديد: 4','معية الله مش مشروطة بحالتك النفسية. سواء كنت قوي أو منهار، هو معاك في اللحظة دي بالظبط.'],
 ['قرآن','رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً','آل عمران: 8','ادعِ بيها دلوقتي. اطلب من ربنا رحمة خاصة تثبّت قلبك في اللحظة اللي إنت فيها.'],

 ['قرآن','وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ','الضحى: 5','وعد صريح من ربنا لنبيه ﷺ، وهو باقٍ لكل قلب مهموم: هيجيلك عطاء يرضيك، استنى بثقة.'],
 ['قرآن','أَلَيْسَ اللَّهُ بِكَافٍ عَبْدَهُ','الزمر: 36','سؤال يفتح القلب: مين غيره تقدر تتكل عليه فعلًا؟ كفايته مش شعار، دي حقيقة تتلمسها لما تسلّم له الأمر.'],

 ['قرآن','وَقُل رَّبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي','طه: 25-26','ادعِ بدعوة موسى عليه السلام. مش لازم تخترع كلام؛ خد الدعوة دي واقولها بصدق.'],
 ['قرآن','فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ','آل عمران: 159','بعد ما تاخد قرارك، سلّم النتيجة لربنا. العزم شغلتك، والتوفيق شغلته هو.'],
 ['قرآن','إِنَّ اللَّهَ مَعَ الصَّابِرِينَ','البقرة: 153','معية خاصة، مش عامة، لأصحاب الصبر. صبرك مش ضعف؛ هو الباب اللي بتدخل بيه لمعية أقرب.'],
 ['قرآن','وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ','الإسراء: 82','القرآن نفسه شفاء. مش لازم تفهم كل كلمة عشان يأثر فيك؛ خليك بس قريب منه.'],
 ['قرآن','وَإِن تَعُدُّوا نِعْمَتَ اللَّهِ لَا تُحْصُوهَا','إبراهيم: 34','وسط أي ضيق، فيه نعم كتير حواليك مش واخد بالك منها. جرب تعدّ حتى ثلاثة منها دلوقتي.'],
 ['قرآن','قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ','الزمر: 53','مهما حسيت إنك مقصر أو غلطان، الباب لسه مفتوح. اليأس من رحمته أكبر غلطة ممكن تعملها.'],

 ['قرآن','رَبِّ اشْرَحْ لِي صَدْرِي','طه: 25','دعوة قصيرة جدًا، سهل تحفظها وتقولها في أي لحظة ضيق يمر بيك.'],
 ['قرآن','فَصَبْرٌ جَمِيلٌ','يوسف: 18','الصبر الجميل هو اللي من غير شكوى للناس ومن غير جزع ظاهر، بس قلبك عارف اتكاله على مين.'],
 ['قرآن','وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ','المائدة: 2','مش لازم تواجه كل حاجة لوحدك. اطلب المساعدة، ودي نفسها من البر اللي ربنا حضّ عليه.'],
