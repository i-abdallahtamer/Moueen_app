const feelingHistory=()=>DB.feelingHistory||(DB.feelingHistory={});
function pickFeelingMessage(feeling){
  const ownBank=(FEELING_BANK[feeling]||FEELING_BANK['غير ذلك']);
  const order=['قرآن','حديث','موقف','حكمة'];
  const hist=DB.feelingHistory[feeling]||{};
  // أولوية مطلقة لمحتوى الشعور نفسه (مصمم ليتناسب معه تحديدًا)
  for(const source of order){
    const candidates=ownBank.map((x,i)=>[x,i]).filter(([x,i])=>x[0]===source && !(hist[source]||[]).includes(i));
    if(candidates.length){
      const [item,i]=candidates[Math.floor(Math.random()*candidates.length)];
      if(!hist[source]) hist[source]=[]; hist[source].push(i); DB.feelingHistory[feeling]=hist; return item;
    }
  }
  // لو بنك الشعور اتصفّح بالكامل، اللجوء لحوض آيات السكينة العام كطبقة احتياطية إضافية
  // (يظهر فقط بعد استنفاد كل المحتوى المخصص للشعور، مش قبله)
  const extraCands=EXTRA_QURAN_COMFORT.map((x,i)=>[x,i]).filter(([x,i])=>!(hist['__extra']||[]).includes(i));
  if(extraCands.length){
    const [item,i]=extraCands[Math.floor(Math.random()*extraCands.length)];
    if(!hist['__extra']) hist['__extra']=[]; hist['__extra'].push(i); DB.feelingHistory[feeling]=hist; return item;
  }
  // انتهى كل شيء: ابدأ دورة جديدة من بنك الشعور نفسه فقط (يبقى الاختيار مناسبًا للحالة دايمًا)
  DB.feelingHistory[feeling]={};
  const first=ownBank[Math.floor(Math.random()*ownBank.length)];
  const idx=ownBank.indexOf(first); if(!DB.feelingHistory[feeling][first[0]])DB.feelingHistory[feeling][first[0]]=[]; DB.feelingHistory[feeling][first[0]].push(idx);
  return first;
}

function pickDua(feeling){
  const key='__dua_'+feeling;
  let used=DB.feelingHistory[key]||[];
  let pool=DUA_BANK.map((x,i)=>i).filter(i=>!used.includes(i));
  if(!pool.length){ used=[]; pool=DUA_BANK.map((x,i)=>i); }
  const idx=pool[Math.floor(Math.random()*pool.length)];
  used.push(idx); DB.feelingHistory[key]=used; save('feelingHistory');
  return DUA_BANK[idx];
}

const GENERAL_KNOWLEDGE = [
 {title:'توماس إديسون: ألف طريقة لا تصلح',teaser:'مخترع أمريكي غيّر العالم بالضوء الكهربائي بعد آلاف المحاولات الفاشلة.',full:`توماس إديسون (1847 - 1931) مخترع ورجل أعمال أمريكي، يُعتبر واحدًا من أكثر المخترعين تأثيرًا في التاريخ الحديث، وسجّل باسمه أكثر من ألف براءة اختراع خلال حياته، من أشهرها المصباح الكهربائي العملي والفونوغراف.\n\nفي أواخر القرن التاسع عشر، كان إديسون يحاول اختراع مصباح كهربائي يدوم للاستخدام المنزلي. المشكلة لم تكن في فكرة الإضاءة بالكهرباء نفسها، بل في إيجاد الخيط المناسب الذي يضيء لفترة طويلة من غير ما يحترق بسرعة.\n\nجرّب آلاف المواد المختلفة: القطن، الكتان، أنواعًا متعددة من الخشب المعالج، وحتى شعر بعض المعارف. كل محاولة كانت تفشل بعد دقائق أو ساعات قليلة. سأله أحد الصحفيين مرة: ألا تشعر بالإحباط بعد كل هذا الفشل؟ فأجاب إجابته الشهيرة: أنا لم أفشل، أنا فقط اكتشفت آلاف الطرق التي لا تصلح.\n\nفي النهاية، بعد أكثر من ألف محاولة، وصل إلى خيط من الكربون المعالج استمر مضيئًا لساعات طويلة، وكان هذا هو الأساس الذي بُنيت عليه صناعة الإضاءة الكهربائية الحديثة.`,lessons:['الفشل المتكرر في التجربة ليس دليلاً على فشلك أنت، بل جزء طبيعي من أي طريق يستحق أن يُقطع.','غيّر تعريفك للفشل: من "نهاية" إلى "معلومة عن طريق لا يصلح".']},
 {title:'هيلين كيلر: الكلمة التي فتحت العالم',teaser:'كاتبة أمريكية فقدت السمع والبصر معًا وهي طفلة، وأصبحت رمزًا عالميًا للإرادة.',full:`هيلين كيلر (1880 - 1968) كاتبة ومحاضرة أمريكية، أصيبت بمرض شديد وهي في التاسعة عشرة من عمرها بالأشهر أدى لفقدانها السمع والبصر معًا. كبرت وهي غير قادرة على التواصل الطبيعي مع من حولها، وكانت نوبات غضبها المستمرة تعكس حجم إحباط طفلة محبوسة في عالم صامت ومظلم.\n\nتغيّر كل شيء عندما جاءت المعلمة آن سوليفان لتعليمها. كانت آن تكتب الحروف بيدها على راحة يد هيلين لتشكل كلمات، لكن هيلين لم تكن تفهم أن لهذه الحركات معنى، حتى جاءت اللحظة الفاصلة عند مضخة المياه في الحديقة: وضعت آن يد هيلين تحت الماء الجاري، وفي نفس الوقت كتبت على يدها الأخرى كلمة "ماء". فجأة أدركت هيلين أن هذه الحركة تعني الشيء البارد المتدفق على يدها الأخرى، وانفتح العالم كله أمامها: كل شيء له اسم، وكل اسم طريق للفهم.\n\nمن هذه اللحظة، تعلمت القراءة والكتابة بطريقة برايل، والتحقت بالجامعة وتخرجت بتفوق، وأصبحت كاتبة ومحاضرة ألهمت الملايين حول العالم، رغم أنها لم تسمع صوتها هي نفسها قط.`,lessons:['أحيانًا كل ما نحتاجه ليس حل المشكلة كاملة دفعة واحدة، بل نقطة اتصال واحدة تفتح كل ما بعدها.','الصبر في التكرار بلا ملل ممكن يغيّر حياة كاملة، سواء كنت المعلّم أو المتعلّم.']},
 {title:'نيلسون مانديلا: حرية بلا انتقام',teaser:'زعيم جنوب أفريقي قضى سبعة وعشرين عامًا في السجن، وخرج ليقود بلاده بالمصالحة لا الثأر.',full:`نيلسون مانديلا (1918 - 2013) سياسي جنوب أفريقي وأول رئيس أسود منتخب لبلاده، قضى حياته في مقاومة نظام الفصل العنصري قبل أن يقودها لاحقًا نحو مصالحة تاريخية.\n\nدخل مانديلا السجن عام 1962 بتهمة مقاومة النظام العنصري، وحُكم عليه بالسجن المؤبد. قضى سبعة وعشرين عامًا كاملة خلف القضبان، جزءًا كبيرًا منها في زنزانة ضيقة بجزيرة روبن، يعمل في محجر جيري تحت شمس حارقة.\n\nكان بإمكانه الخروج مليئًا بالغضب، وكان كثيرون يتوقعون هذا. لكنه استخدم سنوات السجن في القراءة والتفكير والتخطيط، ليس لثأر شخصي، بل لمشروع مصالحة وطنية. عندما أُطلق سراحه أخيرًا عام 1990، فاجأ العالم: لم يدعُ لثأر ممن سجنوه، بل دعا للحوار والمصالحة، وأصبح رئيسًا عام 1994 على رأس حكومة ضمت حتى بعض من كانوا جزءًا من نظامه السابق.\n\nقال مانديلا مرة إنه أدرك في السجن أنه لو خرج وهو لا يزال يحمل الكراهية، فسيظل سجينًا حتى بعد خروجه من الزنزانة.`,lessons:['أطول فترات الألم ممكن تتحول لفترة تجهيز وتخطيط، مش بس فترة انتظار.','التسامح ليس ضعفًا؛ أحيانًا هو أصعب قرار يتخذه إنسان قوي.']},
 {title:'ج. ك. رولينج: اثنا عشر رفضًا قبل هاري بوتر',teaser:'كاتبة بريطانية كانت أمًا عزباء تعيش على إعانة اجتماعية، فأصبحت من أنجح الكاتبات في التاريخ.',full:`ج. ك. رولينج (وُلدت 1965) كاتبة بريطانية، مؤلفة سلسلة هاري بوتر التي تُعد من أكثر السلاسل الأدبية مبيعًا في التاريخ. في منتصف التسعينيات، كانت أمًا عزباء تعيش في إدنبرة بأسكتلندا في ظروف مادية صعبة جدًا، تعتمد على إعانة اجتماعية لتربية ابنتها.\n\nكانت تكتب فصول روايتها الأولى عن ساحر صغير يُدعى هاري بوتر في المقاهي، لأن شقتها الباردة لم تكن مريحة للكتابة. بعد أن أنهت المخطوطة، أرسلتها لدور النشر، ورُفضت من اثني عشر دار نشر مختلفة على التوالي، وكان الرفض قاسيًا بشكل خاص بسبب وضعها المادي الهش.\n\nأخيرًا، وافقت دار نشر صغيرة على طباعة عدد محدود من النسخ، بعد أن اقترح رئيس تحريرها أن يقرأها ابنته ذات الثماني سنوات، فأحبتها وطلبت الفصل التالي فورًا. من هذه البداية المتواضعة، تحولت السلسلة إلى ظاهرة عالمية بيعت منها مئات الملايين من النسخ، وتحولت لأفلام ناجحة، وأصبحت رولينج من أنجح الكاتبات في العالم.`,lessons:['رفض عدد كبير من الناس لفكرتك لا يعني بالضرورة أن الفكرة سيئة؛ أحيانًا يعني فقط أنك لم تصل بعد للشخص المناسب.','الاستمرار بعد الرفض العاشر أصعب بكثير من الاستمرار بعد الرفض الأول، وهنا يكمن الفرق.']},
 {title:'ابن بطوطة: سبعة وعشرون عامًا من الترحال',teaser:'رحّالة مغربي خرج للحج فطاف معظم العالم المعروف وقتها وسجّل رحلته في كتاب خالد.',full:`محمد بن عبد الله المعروف بابن بطوطة (1304 - 1368 أو 1369) رحّالة وقاضٍ مغربي، يُعد من أعظم الرحّالة في التاريخ الإسلامي والعالمي. خرج من مدينة طنجة عام 1325 وهو في الحادية والعشرين من عمره بنية أداء الحج فقط، فتحوّلت رحلته إلى مغامرة استمرت نحو سبعة وعشرين عامًا.\n\nبعد الحج، قرر ألا يعود، بل يواصل استكشاف العالم الإسلامي وما وراءه. زار مصر والشام والعراق وبلاد فارس، ثم اتجه لشرق أفريقيا فالجزيرة العربية فالهند حيث عمل قاضيًا لسنوات في دلهي، ثم وصل لجزر المالديف وسريلانكا والصين. قطع مسافات تقدر بأكثر من مئة وعشرين ألف كيلومتر، رقم مذهل لعصر لم يكن فيه سوى الجمال والسفن الشراعية والمشي الطويل.\n\nواجه في رحلته قراصنة وعواصف بحرية وأمراضًا، وفقد بعض رفقائه في الطريق، لكنه استمر. عندما عاد أخيرًا للمغرب، أملى مذكراته على كاتب بأمر من سلطان البلاد، فصار كتابه "تحفة النظار" أحد أهم مصادر التاريخ الجغرافي والاجتماعي لتلك الحقبة.`,lessons:['أحيانًا نبدأ رحلة بهدف محدد صغير، ونكتشف في الطريق أفقًا أوسع بكثير مما تخيلنا.','التوثيق والكتابة عن التجربة يحوّلها من ذكرى شخصية إلى إرث يستفيد منه آخرون بعدك بقرون.']},
 {title:'مالالا يوسفزاي: رصاصة لم تُسكت صوتًا',teaser:'فتاة باكستانية أُطلق عليها الرصاص لمطالبتها بحق التعليم، فأصبحت أصغر حائزة على نوبل للسلام.',full:`مالالا يوسفزاي (وُلدت 1997) ناشطة باكستانية في مجال حقوق التعليم، وأصغر شخص في التاريخ يفوز بجائزة نوبل للسلام. نشأت في وادي سوات بباكستان، في منطقة فرضت فيها جماعة طالبان قيودًا صارمة، منها منع الفتيات من الذهاب للمدرسة.\n\nبدلاً من الصمت، بدأت مالالا في سن الحادية عشرة كتابة مدونة بحكم مستعار توثّق فيها حياتها اليومية تحت هذه القيود، ومطالبتها بحق الفتيات في التعليم. أصبحت معروفة إعلاميًا، وهذا الظهور جعلها هدفًا مباشرًا: في أكتوبر 2012، وهي في طريقها للمدرسة على متن حافلة، صعد إليها مسلح وأطلق عليها الرصاص في رأسها.\n\nنجت بأعجوبة بعد عمليات جراحية معقدة ورحلة علاج طويلة في بريطانيا. بدلاً من أن تنسحب، خرجت بصوت أعلى وأقوى، وواصلت الحديث في المحافل الدولية عن حق كل طفلة في التعليم. في 2014 وهي في السابعة عشرة فقط، أصبحت أصغر فائزة بجائزة نوبل للسلام في التاريخ.`,lessons:['أعنف محاولة لإسكات صوت ممكن تتحول لسبب يخلي الصوت ده يوصل لأكبر عدد من الناس.','الشجاعة مش غياب الخوف، هي الاستمرار في قول الحق رغم معرفتك بالثمن المحتمل.']},
 {title:'ستيف جوبز: طُرد من شركته ثم أعاد بناءها',teaser:'مؤسس آبل خرج من شركته بقرار مجلس إدارته، ثم عاد بعد إحدى عشرة سنة ليقودها لأعظم عصورها.',full:`ستيف جوبز (1955 - 2011) رجل أعمال ومهندس أمريكي، مؤسس شركة آبل المشارك، ومن أكثر الشخصيات تأثيرًا في صناعة التكنولوجيا الحديثة. أسس آبل مع شريكه ستيف وزنياك عام 1976 في جراج منزل عائلته، وحوّلاها خلال سنوات لواحدة من أهم شركات التكنولوجيا الناشئة.\n\nمع نمو الشركة، بدأت خلافات إدارية بينه وبين مجلس إدارتها الذي عيّنه هو نفسه سابقًا. في 1985، اتخذ المجلس قرارًا بتجريده من صلاحياته، فاستقال من الشركة التي أسسها بيديه، ووصف اللحظة لاحقًا بأنها جعلته يشعر بفشل كامل أمام الجميع.\n\nبدلاً من الانسحاب، أسس شركة جديدة تُدعى نكست، واستثمر في استوديو رسوم متحركة صغير يُدعى بيكسار، تحول لاحقًا لقوة عظمى في صناعة الرسوم المتحركة. في 1996 اشترت آبل شركة نكست، فعاد جوبز لشركته الأولى بعد أحد عشر عامًا، وقادها في أعظم فترات ابتكارها بمنتجات مثل آيفون وآيباد.`,lessons:['أحيانًا أكبر إهانة مهنية ممكن تكون هي الدافع اللي يخليك تبني حاجة أعظم مما كنت متخيل.','الخروج من مكان معين مش دايمًا نهاية؛ ممكن يكون فترة تجهيز لعودة أقوى بكثير.']},
 {title:'أوبرا وينفري: من فقر شديد لتأثير عالمي',teaser:'إعلامية أمريكية نشأت في فقر وإساءة شديدين، لتصبح واحدة من أكثر النساء تأثيرًا في العالم.',full:`أوبرا وينفري (وُلدت 1954) إعلامية ورائدة أعمال أمريكية، تُعد من أكثر الشخصيات الإعلامية تأثيرًا في التاريخ الحديث. وُلدت في ولاية ميسيسيبي لأم مراهقة غير متزوجة، وعاشت طفولة قاسية في فقر شديد، وانتقلت بين عدة أقارب، وتعرضت لإساءات صعبة في سن مبكرة جدًا.\n\nرغم ذلك، وجدت في القراءة والكلام ملجأً حقيقيًا، ونمّت موهبتها في التعبير من خلال المشاركة في أنشطة الكنيسة والمدرسة. دخلت مجال الإعلام مبكرًا، وواجهت رفضًا من مسؤولين اعتبروا أنها لا تصلح للظهور التلفزيوني، لكنها استمرت حتى حصلت على فرصتها الحقيقية في برنامج حواري بشيكاغو كان يعاني من ضعف المشاهدة.\n\nحوّلت هذا البرنامج خلال سنوات قليلة إلى واحد من أنجح البرامج الحوارية في تاريخ التلفزيون الأمريكي، وبنت من خلاله إمبراطورية إعلامية ضخمة، لتصبح لاحقًا رمزًا يُستشهد به في الحديث عن تجاوز أصعب الظروف الممكنة.`,lessons:['نقطة البداية الصعبة جدًا في الحياة لا تحدد بالضرورة نقطة النهاية.','الرفض المبكر من أشخاص في موقع سلطة ليس حكمًا نهائيًا على قدراتك الحقيقية.']},
 {title:'ماري كوري: جائزتا نوبل في عالم أغلقته النساء',teaser:'عالمة بولندية-فرنسية أول من فاز بجائزتي نوبل في مجالين مختلفين، رغم إغلاق أغلب الجامعات أمام النساء وقتها.',full:`ماري كوري (1867 - 1934) عالمة فيزياء وكيمياء بولندية المولد وفرنسية الجنسية لاحقًا، أول شخص في التاريخ يفوز بجائزتي نوبل في مجالين علميين مختلفين، وأول امرأة تفوز بالجائزة على الإطلاق. وُلدت في بولندا في وقت لم يُسمح فيه للنساء بالدراسة في الجامعة الرسمية ببلادها، فدرست سرًا قبل أن تسافر لباريس لتدرس بجامعة السوربون.\n\nعاشت في باريس سنوات دراسية قاسية ماديًا، وتفوقت رغم ذلك، والتقت بزوجها بيير كوري، وبدآ معًا رحلة بحث علمي غيّرت فهم البشرية للفيزياء والكيمياء. اكتشفا معًا عنصري البولونيوم والراديوم، وعملا في ظروف بحثية بدائية داخل كوخ يفتقر لأبسط وسائل الأمان، ما عرّضهما لاحقًا لأضرار صحية جسيمة بسبب التعرض للإشعاع.\n\nحصلت ماري كوري على جائزة نوبل في الفيزياء عام 1903، ثم على جائزة نوبل ثانية في الكيمياء عام 1911، في عالم أكاديمي كان في الغالب مغلقًا تمامًا أمام النساء.`,lessons:['الأنظمة المغلقة أمامك مش دايمًا نهاية الطريق؛ أحيانًا فيه طريق بديل تقدر تبني بيه نفس المستقبل.','النجاح في مجال واحد مش سقف؛ ممكن يكون بداية لمجال تاني تمامًا.']},
 {title:'نيك فويتشيتش: وُلد بلا أطراف وأصبح ملهمًا عالميًا',teaser:'أسترالي وُلد بدون ذراعين ولا ساقين، تحول من التفكير في إنهاء حياته لإلهام ملايين البشر حول العالم.',full:`نيك فويتشيتش (وُلد 1982) متحدث تحفيزي أسترالي، وُلد بحالة نادرة جدًا جعلته بدون ذراعين وبدون ساقين، ولديه فقط قدم صغيرة بها إصبعان. صُدم والداه بشدة عند ولادته، ومر في طفولته ومراهقته بفترات قاسية من التنمر والعزلة، ووصل في مرحلة من حياته للتفكير الجاد في إنهاء حياته وهو لا يزال طفلاً.\n\nنقطة التحول كانت عندما بدأ ينظر لحالته كتحدٍ يمكن إيجاد طرق مختلفة للتعامل معه، لا كنهاية لكل الاحتمالات. تعلم الكتابة والسباحة وحتى ركوب الأمواج، باستخدام قدمه الصغيرة وتوازن جسدي طوّره بمشقة كبيرة عبر سنوات من المحاولة.\n\nبدأ بمشاركة قصته مع مجموعات صغيرة في مدرسته وكنيسته، وتدريجيًا تلقى دعوات أكبر للحديث في فعاليات ومؤتمرات حول العالم. أسس منظمة غير ربحية لدعم ذوي الإعاقة، وسافر لأكثر من ستين دولة يحكي قصته لملايين البشر وجهًا لوجه، وتزوج لاحقًا وأصبح أبًا لعدة أطفال.`,lessons:['أصعب مرحلة في حياتك ممكن تتحول لأقوى رسالة تقدمها لغيرك لاحقًا.','مشاركة قصتك، حتى لو بدأت بمجموعة صغيرة جدًا، ممكن تكبر بطرق ماكنتش متخيلها.']},
 {title:'هارلاند ساندرز: بداية جديدة في الخامسة والستين',teaser:'رجل أمريكي فقد كل مصدر دخله في سن التقاعد، فسافر يبيع وصفة دجاج على أبواب المطاعم حتى بنى إمبراطورية عالمية.',full:`هارلاند ساندرز (1890 - 1980) رجل أعمال أمريكي، مؤسس سلسلة مطاعم كنتاكي فرايد تشيكن. عمل في وظائف متفرقة كثيرة طوال حياته، وأدار محطة وقود صغيرة كان يقدم فيها وجبات دجاج مقلي لزبائنه بوصفة خاصة طوّرها بنفسه على مدار سنوات.\n\nفي الخامسة والستين من عمره، أُغلق الطريق السريع الذي كان يمر بجانب محطته، فانهارت حركة الزبائن. اضطر لبيع المحطة، ولم يتبقَّ له سوى شيك ضمان اجتماعي شهري بسيط ووصفة الدجاج. بدلاً من التقاعد، قرر أن يسافر بسيارته من مطعم لآخر عبر عدة ولايات، يعرض على أصحابها وصفته مقابل نسبة من مبيعاتهم، وتعرّض للرفض مئات المرات، وكان ينام أحيانًا في سيارته لتوفير تكلفة الفنادق.\n\nبعد سنوات من الرفض المتكرر، بدأ عدد من أصحاب المطاعم بالموافقة، وانتشرت العلامة التي عُرفت لاحقًا باسم كنتاكي فرايد تشيكن حتى أصبحت واحدة من أكبر سلاسل المطاعم في العالم.`,lessons:['السن أو مرحلة الحياة اللي إنت فيها مش شرط تحدد إمكانية بداية جديدة تمامًا.','الأصول اللي إنت محتاجها للبداية ممكن تكون أبسط بكثير مما تتخيل: مهارة واحدة حقيقية وإصرار على عرضها.']},
 {title:'ابن الهيثم: من إقامة جبرية إلى علم البصريات',teaser:'عالم عربي حبسه الحاكم فحوّل سنوات الحبس إلى أخصب فترة بحثية غيّرت فهم العلم للضوء والعين.',full:`الحسن بن الهيثم (965 - 1040) عالم موسوعي عربي في الرياضيات والفلك والفيزياء، يُلقب بأبي علم البصريات الحديث. عاش في القاهرة أوائل القرن الحادي عشر الميلادي، ووعد الحاكم بأمر الله بمشروع ضخم لتنظيم فيضان نهر النيل عبر بناء سد عند أسوان، وسافر لمصر تلبية لهذه الدعوة.\n\nعندما عاين موقع المشروع أدرك أن تقنيات ذلك العصر لا تسمح فعليًا بتنفيذه، وكان الاعتراف بهذا الفشل أمام حاكم معروف بشدته يحمل خطرًا حقيقيًا على حياته. لتجنب غضبه، تظاهر ابن الهيثم بالجنون، فوُضع تحت إقامة جبرية استمرت سنوات طويلة حتى وفاة الحاكم.\n\nبدلاً من أن يضيع هذه السنوات، حوّلها لأخصب فترة بحثية في حياته، فكتب كتابه الشهير "المناظر" الذي وضع أسس علم البصريات الحديث، وفسّر فيه بدقة كيفية عمل العين البشرية والضوء والانعكاس والانكسار، بطريقة علمية تجريبية سبقت عصرها بقرون، وأثّرت لاحقًا في علماء كبار مثل نيوتن وكيبلر.`,lessons:['أحيانًا أصعب فترات القيد والحبس ممكن تتحول لأخصب فترة إنتاج فكري لو استخدمتها صح.','العمل العلمي أو الفكري الجاد ممكن يفضل مؤثر لقرون طويلة بعد صاحبه بكتير.']},
 {title:'والت ديزني: فُصل بسبب "قلة الخيال"',teaser:'رسام أمريكي فُصل من عمله لأن رئيسه رآه يفتقر للإبداع، ثم أسس واحدة من أعظم إمبراطوريات الترفيه في التاريخ.',full:`والت ديزني (1901 - 1966) رسام ومنتج أمريكي، مؤسس شركة ديزني، وأحد أكثر الأسماء ارتباطًا بصناعة الرسوم المتحركة والترفيه العائلي في العالم. في بداية مسيرته، عمل رسامًا في صحيفة صغيرة، وحصل على وظيفة في استوديو صغير للرسوم المتحركة، لكنه فُصل منها بعد فترة قصيرة بحجة أنه يفتقر للخيال الكافي وليس لديه أفكار جيدة بما يكفي.\n\nلم يتوقف عند هذا الرفض. أسس مع أخيه روي استوديو رسوم متحركة خاصًا بهما، وواجها صعوبات مالية متكررة، ووصلا لإعلان إفلاس شركتهما الأولى بالكامل بعد فشل أحد مشاريعهما. استمر ديزني في التجربة، وابتكر لاحقًا شخصية ميكي ماوس التي حققت نجاحًا واسعًا، ثم أول فيلم رسوم متحركة طويل في التاريخ "سنووايت والأقزام السبعة"، رغم تحذير كثيرين في الصناعة من أن فيلمًا كاملاً بالرسوم المتحركة سيكون كارثة تجارية. أثبتت النتائج عكس ذلك تمامًا، وبُنيت على أساسها إمبراطورية ترفيهية عالمية ضخمة ما زالت قائمة حتى اليوم.`,lessons:['تقييم شخص واحد لموهبتك في مرحلة مبكرة مش حكم نهائي على قيمتها الحقيقية.','أكبر إنجازاتك أحيانًا بتيجي من فكرة كل الناس حواليك بتقولك إنها مستحيلة.']},
 {title:'ليونيل ميسي: الطفل الذي كان أقصر من أن يلعب',teaser:'لاعب أرجنتيني عانى من نقص هرمون النمو في طفولته، وأصبح من أعظم لاعبي كرة القدم في التاريخ.',full:`ليونيل ميسي (وُلد 1987) لاعب كرة قدم أرجنتيني، حائز على أكثر من سبع جوائز الكرة الذهبية، وبطل كأس العالم مع منتخب بلاده عام 2022. في طفولته بالأرجنتين، شُخّص ميسي بحالة نقص في هرمون النمو، وكان علاجها مكلفًا جدًا لدرجة أن ناديه المحلي لم يستطع الاستمرار في تمويله، وكان حجمه الصغير مقارنة بأقرانه يجعل كثيرين يشككون في مستقبله الرياضي.\n\nفي سن الثالثة عشرة، سافر مع عائلته إلى إسبانيا بعدما وافق نادي برشلونة على تمويل علاجه مقابل انضمامه لأكاديميته الشهيرة، في قرار وُصف حينها بأنه مقامرة كبيرة على طفل نحيل الجسد. عانى ميسي في البداية من الغربة والحنين لبلاده، واستمر في العلاج الهرموني حتى سن السادسة عشرة تقريبًا وهو يحاول إثبات نفسه وسط لاعبين أكبر حجمًا بكثير.\n\nتفوقت موهبته الفنية على أي قيد جسدي، وصعد بسرعة في صفوف الفريق الأول لبرشلونة، ليصبح لاحقًا أحد أعظم لاعبي كرة القدم في تاريخ الرياضة، حاملاً قصة تبدأ بطفل كان الأطباء يشككون في قدرته حتى على النمو بشكل طبيعي.`,lessons:['القيود الجسدية أو الصحية في مرحلة الطفولة مش شرط تحدد سقف إمكانياتك لاحقًا.','أحيانًا أكبر رهان على قدراتك بيجي من شخص واحد يشوف فيك حاجة إنت نفسك لسه مش واثق منها.']},
 {title:'أبراهام لينكولن: سلسلة فشل قبل البيت الأبيض',teaser:'سياسي أمريكي خسر معظم الانتخابات التي خاضها وأفلس تجاريًا مرتين، قبل أن يصبح أحد أعظم رؤساء أمريكا.',full:`أبراهام لينكولن (1809 - 1865) السادس عشر لرؤساء الولايات المتحدة، ويُعتبر على نطاق واسع أحد أعظم رؤسائها لدوره في إنهاء العبودية وقيادة البلاد خلال الحرب الأهلية الأمريكية. قبل وصوله للرئاسة، مرّ لينكولن بسلسلة طويلة من الإخفاقات: أفلس تجاريًا مرتين في عمله الخاص، وخسر عدة انتخابات متتالية لمجلس الولاية والكونغرس ومجلس الشيوخ على مدار أكثر من عشرين عامًا.\n\nفي منتصف هذه الفترة، تعرض لانهيار عصبي حاد بعد سلسلة من الخسائر الشخصية والمهنية، ووصفه من عرفوه في تلك الفترة بأنه كان في أحلك أيامه النفسية. رغم ذلك، استمر في العمل السياسي والقانوني، وبنى تدريجيًا سمعة كخطيب قوي وصاحب مبادئ واضحة ضد توسع العبودية في الولايات الجديدة.\n\nفي عام 1860، وبعد كل هذه الإخفاقات المتراكمة، فاز لينكولن برئاسة الولايات المتحدة، وقاد البلاد عبر واحدة من أصعب فتراتها التاريخية، ووقّع إعلان تحرير العبيد الذي غيّر مسار البلاد إلى الأبد.`,lessons:['عدد مرات الخسارة اللي مررت بيها مش مقياس لقيمتك أو لمستقبلك؛ المهم إنك تفضل في الملعب.','أحلك الفترات النفسية ممكن تسبق أعظم إنجازاتك لو قدرت تكمل خطوة بعد خطوة.']},
 {title:'طه حسين: عميد الأدب العربي الذي لم ير الدنيا',teaser:'كاتب مصري فقد بصره وهو طفل صغير في قرية فقيرة، وأصبح أحد أعظم مفكري وأدباء العربية في العصر الحديث.',full:`طه حسين (1889 - 1973) كاتب ومفكر مصري، لُقّب بـ"عميد الأدب العربي"، وكان من أبرز المفكرين والأدباء العرب في القرن العشرين. وُلد في قرية صغيرة بمحافظة المنيا لأسرة محدودة الدخل، وفقد بصره تمامًا وهو في الثالثة من عمره بسبب مرض العيون ورعاية طبية خاطئة كانت شائعة في القرى المصرية وقتها.\n\nرغم فقدان بصره، حفظ القرآن الكريم كاملاً وهو صغير، والتحق بالأزهر الشريف، ثم بالجامعة المصرية الحديثة التأسيس، وسافر لاحقًا لفرنسا لدراسة الدكتوراه، معتمدًا على من كانوا يقرؤون له النصوص بصوت عالٍ، وعلى ذاكرة استثنائية طوّرها لتعويض عجزه البصري.\n\nكتب طه حسين عشرات الكتب في الأدب والنقد والفكر، من أشهرها سيرته الذاتية "الأيام" التي وثّق فيها طفولته وصراعه مع الإعاقة والفقر، وأصبح لاحقًا وزيرًا للمعارف في مصر، وأثّر بأفكاره في أجيال كاملة من المثقفين العرب، رغم أنه لم ير الدنيا بعينيه منذ طفولته المبكرة.`,lessons:['فقدان حاسة أساسية زي البصر مش نهاية الطريق لمن يملك عزيمة حقيقية وذاكرة يبنيها بديلاً.','الظروف المادية الصعبة في الطفولة ممكن تتحول لدافع مش عائق، لو قابلها إصرار حقيقي على التعلم.']},
 {title:'ستيفن هوكينغ: عقل يتحدى جسدًا متجمدًا',teaser:'عالم فيزياء بريطاني شُخّص بمرض عصبي نادر وهو في الحادية والعشرين، وأصبح من أعظم علماء الكون في التاريخ الحديث.',full:`ستيفن هوكينغ (1942 - 2018) عالم فيزياء نظرية بريطاني، من أكثر العلماء تأثيرًا في فهم الثقوب السوداء ونشأة الكون. وهو طالب دراسات عليا في الحادية والعشرين من عمره، شُخّص بمرض التصلب الجانبي الضموري، وهو مرض عصبي نادر يؤدي تدريجيًا لشلل كامل في العضلات، وأخبره الأطباء وقتها أن أمامه سنتين أو ثلاثة فقط ليعيشها.\n\nعاش هوكينغ بعد هذا التشخيص أكثر من خمسين عامًا، رغم أن المرض شلّ جسده تدريجيًا حتى أصبح غير قادر على الحركة أو الكلام الطبيعي، واعتمد في تواصله على جهاز إلكتروني يترجم حركات وجهه القليلة المتبقية إلى كلمات منطوقة عبر حاسوب.\n\nرغم هذا القيد الجسدي شبه الكامل، واصل هوكينغ أبحاثه العلمية، ونشر نظريات غيّرت فهم البشرية للثقوب السوداء وطبيعة الزمن، وألّف كتاب "تاريخ موجز للزمن" الذي أصبح من أكثر الكتب العلمية مبيعًا في التاريخ، وأثبت أن قدرة العقل على العمل لا علاقة لها بقدرة الجسد على الحركة.`,lessons:['أشد القيود الجسدية ممكن تعجز الجسد لكن مش شرط تعجز العقل عن الإنتاج والتأثير.','تشخيص طبي قاسٍ في لحظة معينة مش حكمًا نهائيًا على طول أو قيمة الحياة اللي بعده.']},
 {title:'إيلون ماسك: أسبوع كاد ينهار فيه كل شيء',teaser:'رجل أعمال أمريكي جنوب أفريقي المولد كاد يفقد شركتيه الكبريين في نفس الأسبوع تقريبًا قبل أن يصبحا من أنجح شركات العالم.',full:`إيلون ماسك (وُلد 1971) رجل أعمال جنوب أفريقي المولد وأمريكي الجنسية لاحقًا، مؤسس ومدير شركتي تسلا وسبيس إكس، من أبرز رواد الأعمال في مجالات السيارات الكهربائية واستكشاف الفضاء. في نهاية عام 2008، كانت شركتاه على شفا الإفلاس في نفس الوقت تقريبًا: سبيس إكس فشلت في إطلاق صاروخها ثلاث مرات متتالية وكانت الأموال شبه منتهية، وتسلا كانت تواجه أزمة تمويل حادة وسط الأزمة المالية العالمية.\n\nاستثمر ماسك كل ما تبقى من أمواله الشخصية في الشركتين معًا، في مقامرة وصفها لاحقًا بأنها كانت أصعب فترة في حياته نفسيًا وماليًا. في محاولة رابعة وأخيرة، نجحت سبيس إكس أخيرًا في إطلاق صاروخها بنجاح، مما أنقذ الشركة من الانهيار وأمّن لها لاحقًا عقدًا ضخمًا مع وكالة ناسا. في نفس الفترة تقريبًا، نجحت تسلا في تأمين تمويل جديد في اللحظات الأخيرة قبل نفاد السيولة تمامًا.\n\nمن هذه اللحظة الحرجة جدًا، تحولت الشركتان لاحقًا لتصبحا من أهم الشركات في مجاليهما عالميًا، بعدما كانتا على بعد أيام قليلة من الانهيار الكامل.`,lessons:['أحيانًا الفرق بين الانهيار الكامل والنجاح الكبير هو محاولة واحدة أخيرة لم تستسلم لها.','المخاطرة الكبيرة المحسوبة جزء طبيعي من أي مشروع يغيّر قواعد لعبة كاملة.']},
 {title:'جاك ما: رُفض من كنتاكي وأسس أكبر منصة تجارية في آسيا',teaser:'مدرس صيني رُفض من عشرات الوظائف البسيطة، وأصبح مؤسس شركة علي بابا العملاقة.',full:`جاك ما (وُلد 1964) رجل أعمال صيني، مؤسس مجموعة علي بابا، إحدى أكبر شركات التجارة الإلكترونية في العالم. نشأ في مدينة هانغتشو الصينية لأسرة متواضعة الدخل، ورسب مرتين في امتحان القبول الجامعي قبل أن يُقبل أخيرًا في كلية محلية بعد محاولته الثالثة.\n\nتقدم لاحقًا لعشرات الوظائف البسيطة ورُفض منها جميعًا تقريبًا، ومن ضمنها طلب توظيف تقدم به لفرع كنتاكي فرايد تشيكن الذي افتُتح حديثًا في مدينته، حيث تقدم للوظيفة أربعة وعشرون شخصًا وقُبل ثلاثة وعشرون منهم، وكان هو الوحيد المرفوض. كذلك رُفض من كلية الشرطة المحلية ومن عدة وظائف إدارية بسيطة أخرى.\n\nفي منتصف التسعينيات، وأثناء رحلة عمل لأمريكا، تعرّف جاك ما على الإنترنت لأول مرة، وأدرك حجم الفرصة التجارية الكامنة فيه رغم أن الإنترنت لم يكن منتشرًا بعد في الصين. أسس شركة علي بابا عام 1999 من شقته الخاصة مع مجموعة من الأصدقاء، وتحولت خلال سنوات لواحدة من أكبر منصات التجارة الإلكترونية في العالم، وأصبح جاك ما أحد أثرى رجال الأعمال في آسيا.`,lessons:['الرفض المتكرر من عشرات الوظائف البسيطة مش مؤشر نهائي على قدراتك المستقبلية.','أحيانًا الفرصة الحقيقية بتكون في مجال محدش حواليك لسه واخد باله منه.']},
 {title:'عبد الرحمن الداخل: صقر قريش الناجي الوحيد',teaser:'أمير أموي هرب وهو شاب من مذبحة استهدفت عائلته كاملة، وعبر قارتين ليؤسس دولة جديدة في الأندلس.',full:`عبد الرحمن بن معاوية، المعروف بـ"صقر قريش" (731 - 788)، أمير أموي أسس الإمارة الأموية في الأندلس. عندما سقطت الدولة الأموية في دمشق عام 750 على يد العباسيين، تعرضت عائلته بالكامل تقريبًا للقتل في مذبحة واسعة استهدفت القضاء على كل أفراد البيت الأموي، وكان عبد الرحمن حينها شابًا في العشرين من عمره تقريبًا.\n\nهرب عبد الرحمن بأعجوبة وسط مطاردة مستمرة، عابرًا الصحراء ثم شمال أفريقيا لسنوات، متخفيًا ومتنقلاً من قبيلة لأخرى وهو مطارَد باستمرار من عملاء الدولة العباسية الجديدة، وفقد في هذه الرحلة معظم من كان معه من أهله وأصحابه المقربين.\n\nبعد رحلة هروب استمرت نحو خمس سنوات، عبر عبد الرحمن إلى الأندلس (إسبانيا الحالية) التي كانت بعيدة عن قبضة العباسيين المباشرة، واستطاع بذكاء سياسي وعسكري كبير أن يوحد القبائل والفصائل المتناحرة هناك، وأسس إمارة أموية مستقلة استمرت لقرون، وازدهرت في عهدها قرطبة لتصبح واحدة من أعظم حواضر العالم الإسلامي في العلم والعمارة.`,lessons:['فقدان كل شيء تقريبًا في لحظة واحدة مش نهاية الطريق، ممكن يكون بداية فصل جديد كامل.','الصبر على رحلة طويلة من عدم الاستقرار ممكن يؤدي في النهاية لبناء شيء يدوم لقرون.']},
 {title:'تشارلز ديكنز: من مصنع الأحذية إلى عمالقة الأدب',teaser:'روائي بريطاني عمل طفلاً في مصنع بعد سجن والده، وأصبح أحد أعظم الروائيين في تاريخ الأدب الإنجليزي.',full:`تشارلز ديكنز (1812 - 1870) روائي بريطاني، يُعد أحد أعظم الكتّاب في تاريخ الأدب الإنجليزي، ومؤلف روايات خالدة مثل "أوليفر تويست" و"قصة مدينتين". عندما كان ديكنز في الثانية عشرة من عمره، سُجن والده بسبب الديون، وفق ما كان معمولاً به وقتها في بريطانيا، واضطرت الأسرة لإرسال الطفل تشارلز للعمل في مصنع لتلميع الأحذية لساعات طويلة يوميًا مقابل أجر زهيد، بدلاً من الذهاب للمدرسة.\n\nكانت ظروف العمل في المصنع قاسية جدًا: رطوبة، فئران، وساعات عمل طويلة وسط أطفال آخرين في ظروف مشابهة. عاش ديكنز هذه التجربة بمرارة شديدة، ووصفها لاحقًا بأنها كانت من أصعب فترات حياته النفسية، وأخفاها عن معظم من عرفهم طوال حياته لاحقًا بسبب الشعور بالعار المرتبط بها في ذلك المجتمع.\n\nبعد خروج والده من السجن وتحسن وضع الأسرة نسبيًا، عاد ديكنز للتعليم، وبدأ العمل لاحقًا في الصحافة والكتابة، مستخدمًا ذكرياته القاسية عن الفقر وعمالة الأطفال كمادة خام لرواياته التي فضحت الظلم الاجتماعي في بريطانيا الفيكتورية، وأصبح أحد أكثر الكتّاب قراءة وتأثيرًا في تاريخ الأدب العالمي.`,lessons:['أقسى تجارب الطفولة ممكن تتحول لاحقًا لمادة إبداعية حقيقية بدل ما تبقى مجرد جرح مخفي.','الخروج من ظروف صعبة جدًا مش نهاية القصة، وأحيانًا بيكون هو المصدر الحقيقي للرسالة اللي هتقولها لاحقًا.']},
];

function openQuoteAuthorModal(index){
  const q=QUOTES[index]; if(!q) return;
  const bio=QUOTE_AUTHORS[q[1]]||'شخصية مؤثرة تُنسب لها هذه المقولة.';
  const o=document.createElement('div');o.className='modal-overlay';
  o.innerHTML=`<div class="modal" style="max-width:440px">
    <div style="font-size:15px;font-weight:700;line-height:1.9;color:var(--green-deep);margin-bottom:12px">"${esc(q[0])}"</div>
    <div style="font-weight:900;font-size:15px;margin-bottom:6px">— ${esc(q[1])}</div>
    <div style="font-size:13px;line-height:2;color:var(--ink)">${esc(bio)}</div>
    <button class="btn btn-primary btn-block" style="margin-top:16px" id="qaClose">تمام ✓</button>
  </div>`;
  document.body.appendChild(o);
  o.querySelector('#qaClose').onclick=()=>o.remove();
  o.addEventListener('click',e=>{if(e.target===o)o.remove();});
}

    ${lessons.length?`<div class='knowledge-lessons'><div class='lbl'>✦ إيه اللي تقدر تاخده منها</div><ul>${lessons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    <button class='btn btn-primary btn-block' id='gkClose'>خرجت بفكرة ✓</button>
  </div>`;
  document.body.appendChild(o);o.querySelector('#gkClose').onclick=()=>o.remove();o.addEventListener('click',e=>{if(e.target===o)o.remove();});
}

function openKnowledgeModal(index){
  const k = DAILY_KNOWLEDGE[index];
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:440px;">
    <div class="knowledge-type">${esc(k.type)}</div>
    <h3 style="margin-top:10px;">${esc(k.title)}</h3>
    <div class="knowledge-modal-body">${esc(k.full)}</div>
    ${k.lessons && k.lessons.length ? `<div class="knowledge-lessons">
      <div class="lbl">✦ إيه اللي نستفيده؟</div>
      <ul>${k.lessons.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
    </div>` : ''}
    <button class="btn btn-primary btn-block" style="margin-top:18px;" id="knowClose">تمام، فهمت</button>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#knowClose').onclick = ()=> document.body.removeChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) document.body.removeChild(overlay); });
}

function showModal({title, placeholder, initial='', onConfirm}){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>${esc(title)}</h3>
    <input type="text" id="modalInput" placeholder="${esc(placeholder)}" value="${esc(initial)}">
    <div class="modal-btns"><button class="btn btn-ghost" id="modalCancel">إلغاء</button><button class="btn btn-primary" id="modalOk">حفظ</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#modalInput');
  input.focus(); input.select();
  const close = ()=> document.body.contains(overlay) && document.body.removeChild(overlay);
  overlay.querySelector('#modalCancel').onclick = close;
  overlay.querySelector('#modalOk').onclick = ()=>{ onConfirm(input.value); close(); };
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ onConfirm(input.value); close(); } if(e.key==='Escape') close(); });
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
}

let currentTab = 'home';
const RENDERERS = { home:renderHome, quran:renderQuran, habits:renderHabits, goals:renderGoals, courses:renderCourses, stats:renderStats, settings:renderSettings };

function renderNav(){
  document.querySelectorAll('.nav-btn').forEach(btn=>{ btn.onclick = ()=>{ if(btn.dataset.tab==='more') openMoreMenu(); else navigate(btn.dataset.tab); }; });
}
function navigate(tab){
  if(tab==='settings'){openSettingsFromMore();return;}
  currentExtraTab=null; const m=document.getElementById('moreMenu'); if(m)m.style.display='none';
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  if(tab!=='quran') hideActionBar();
  renderTab(tab);
  window.scrollTo(0,0);
}
function renderTab(tab){
  if(tab!==currentTab && tab!=='home') { /* still allow background refresh of home stats */ }
  if(!loaded) return;
  if(currentExtraTab){ renderExtra(currentExtraTab); return; }
  if(tab===currentTab){ if(typeof RENDERERS[tab]==='function') RENDERERS[tab](); else if(tab==='settings' && typeof renderSettings==='function') renderSettings(); }
  else if(tab==='home') { /* refresh silently not shown */ }
}
